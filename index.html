<!doctype html><html lang="ta"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>நம்மூர் · NammaOor</title>
<meta name="description" content="Tamil Nadu local shops directory — scan QR, view products & offers, call or WhatsApp your local shop.">
<meta property="og:type" content="website">
<meta property="og:title" content="நம்மூர் NammaOor — Local Shops Directory">
<meta property="og:description" content="Scan QR → products, offers, call, WhatsApp. Tamil Nadu ulloor kadaigal ellam oru idathula!">
<meta property="og:image" content="https://nammaoor.shop/logo.png">
<meta property="og:url" content="https://nammaoor.shop/">

<meta name="theme-color" content="#FF2E7E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@400..800&family=Poppins:wght@400;600;700;800&family=Mukta+Malar:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<style>:root{--saffron:#FF6A00;--magenta:#FF2E7E;--purple:#7A2FF7;--teal:#008C78;
  --ink:#141225;--bg:#f5f4fb;--line:#e7e4f2;--muted:#6b6880}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:var(--ink)}
a{text-decoration:none;color:inherit}
.brand{font-family:'Baloo Thambi 2';font-weight:800;
  background:linear-gradient(135deg,var(--saffron),var(--magenta),var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(135deg,var(--saffron),var(--magenta),var(--purple));
  color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--purple);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn.tl{background:var(--teal)}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 22px rgba(30,20,70,.07);
  border:1px solid var(--line);margin-bottom:14px}
.input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;margin:6px 0;font-size:14px;background:#fff}
.container{max-width:940px;margin:0 auto;padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;
  background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.header img{height:38px}
.nav a{margin-left:16px;font-weight:600;font-size:14px;color:var(--muted)}
.kpi{flex:1;min-width:130px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}
.kpi b{font-size:24px;display:block}.kpi span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;background:#eafaf4;color:var(--teal);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.red{background:#fdeaea;color:#c0392b}
.hero{background:linear-gradient(135deg,#fff,#f1ecff);border-radius:22px;padding:34px;text-align:center;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700}
.tag.a{background:#eafaf4;color:#008C78}.tag.e{background:#fdeaea;color:#c0392b}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabx{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;
  background:#fff;cursor:pointer;font-weight:600;font-size:13px}
.tabx.on{background:linear-gradient(135deg,var(--saffron),var(--magenta),var(--purple));color:#fff;border-color:transparent}
.muted{color:var(--muted);font-size:13px}
.qrbox{width:180px;height:180px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.qrbox img{width:100%;height:100%}
label{font-size:12px;font-weight:600;color:var(--muted)}

/* ===== AI Listing + Product (V1.4, additive) ===== */
.ai-banner{background:linear-gradient(135deg,#fff,#fbf3ff);border:1px solid #ecd9ff}
.ai-cta{background:linear-gradient(135deg,var(--purple),var(--magenta))!important;color:#fff!important;box-shadow:0 6px 16px rgba(122,47,247,.28)}
.ai-msg{background:#f4f0ff;border:1px solid #e4d7ff;color:#4b2a8a;font-size:14px}
.steps{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.stepdot{flex:1;min-width:60px;text-align:center;opacity:.45;transition:.3s}
.stepdot b{display:block;width:30px;height:30px;line-height:30px;margin:0 auto 4px;border-radius:50%;
  background:#eee;color:#888;font-weight:800}
.stepdot span{font-size:11px;color:var(--muted)}
.stepdot.on{opacity:1}.stepdot.on b{background:linear-gradient(135deg,var(--purple),var(--magenta));color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.lbl{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:8px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{background:#f1ecff;color:#5b2ea6;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.ai-photowrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.ai-photo{width:200px;height:200px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.quality{margin-top:12px;padding:12px;border-radius:12px;font-size:14px}
.quality.good{background:#eafaf1;border:1px solid #bfe8d0}
.quality.mid{background:#fff7e6;border:1px solid #ffe0a3}
.quality.bad{background:#fdeaea;border:1px solid #f2b8b8}
.quality ul{margin:6px 0 0 18px}
.ppreview{border:2px dashed #d9c9ff}
.prow{display:flex;gap:16px;flex-wrap:wrap}
.prow .pimg{width:180px;height:180px;object-fit:cover;border-radius:14px}
.pprice{font-size:24px;font-weight:800;color:var(--magenta);margin:6px 0}
.pprice s{font-size:15px;font-weight:500;margin-left:8px}
/* catalog grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  transition:transform .18s,box-shadow .18s;display:block;color:inherit}
.pcard:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(30,20,70,.12)}
.pcimg{width:100%;height:140px;object-fit:cover;display:block;background:#f3f0fb}
.pcimg.ph,.pbig.ph{display:flex;align-items:center;justify-content:center;color:#b7b2c8;font-size:13px}
.pcbody{padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.pctitle{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcprice{font-weight:800;color:var(--ink)}.pcprice s{font-weight:500;margin-left:5px;font-size:12px}
.dot{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.dot.published{background:#eafaf1;color:var(--teal)}.dot.hidden,.dot.draft{background:#f0eef5;color:#8a8699}
/* product page */
.product-page .pmain{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0}
.pgallery{flex:1;min-width:280px}
.pbig{width:100%;max-height:420px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:16px}
.pthumbs{display:flex;gap:8px;margin-top:8px}
.pthumbs img{width:60px;height:60px;object-fit:cover;border-radius:9px;border:2px solid transparent;cursor:pointer}
.pthumbs img.on{border-color:var(--magenta)}
.pinfo{flex:1;min-width:280px}
.ptitle{font-size:26px;margin:8px 0}
.pshort{font-size:15px;color:#4a4760}
.badge-verify{background:#eafaf4;color:var(--teal);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.offbadge{background:var(--magenta);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.stars span{color:#d8d5e2;font-size:15px}.stars span.on{color:#ffb400}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.orderbox{background:#f7f4ff;border:1px solid #e6dbff;border-radius:14px;padding:14px;margin-top:8px}
.btn.wa{background:#25D366!important;color:#fff!important;margin-top:8px;width:100%}
.thankyou{background:#eafaf1;border:1px solid #bfe8d0;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
.hl{margin:6px 0 0 18px}.hl li{margin:3px 0}
table.spec td{padding:7px 9px;font-size:14px}
.rbar{display:flex;align-items:center;gap:8px;font-size:12px;margin:2px 0}
.rtrack{flex:1;height:7px;background:#eee;border-radius:6px;overflow:hidden}
.rfill{height:100%;background:#ffb400}
.revform{background:#faf9ff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.revform>*{margin-bottom:7px}
.starpick span,.review .stars span{cursor:pointer;font-size:22px;color:#d8d5e2}.starpick span.on{color:#ffb400}
.revthumb{width:52px;height:52px;object-fit:cover;border-radius:8px}
.review{border-top:1px solid var(--line);padding:10px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;box-shadow:0 8px 22px rgba(0,0,0,.25)}
/* order track */
.track{display:flex;flex-direction:column;gap:0;margin-top:10px}
.tstep{display:flex;align-items:center;gap:12px;padding:8px 0;position:relative;opacity:.5}
.tstep.done{opacity:1}
.tdot{width:30px;height:30px;border-radius:50%;background:#eee;color:#999;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:13px}
.tstep.done .tdot{background:linear-gradient(135deg,var(--teal),#00b894);color:#fff}
.orderrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
/* skeleton */
.skel .sk,.skln{background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;
  animation:sh 1.2s infinite;border-radius:6px}
.skln{height:11px;margin:5px 0}.skln.sm{width:60%}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== Premium product cards (V1.5) ===== */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:14px}
@media(max-width:520px){.pgrid{grid-template-columns:repeat(2,1fr);gap:11px}}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;
  flex-direction:column;color:inherit;text-decoration:none;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;will-change:transform}
.pcard:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(60,30,120,.15)}
.pcimg-wrap{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;
  background:linear-gradient(135deg,#f6f2fc,#ece4f8);display:block}
.pcimg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.pcard:hover .pcimg{transform:scale(1.06)}
.off-tag{position:absolute;top:9px;left:9px;background:linear-gradient(135deg,var(--magenta),var(--saffron));
  color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px;box-shadow:0 3px 8px rgba(255,46,126,.35)}
.oos-tag{position:absolute;bottom:9px;left:9px;background:rgba(20,18,37,.82);color:#fff;font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:8px}
.pcbody{padding:11px 12px 13px;display:flex;flex-direction:column;gap:4px}
.pc-brand{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#9a8fc0}
.pctitle{font-size:14px;font-weight:600;line-height:1.35;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pc-rate{display:flex;align-items:center;gap:5px;font-size:12px}
.stars.sm span{font-size:12px}
.stars span{color:#d8d5e2}.stars span.on{color:#ffb400}
.pcprice{font-size:17px;font-weight:800;color:var(--ink);display:flex;align-items:baseline;gap:7px}
.pcprice s{font-size:12px;font-weight:500;color:var(--muted)}
.pc-desc{font-size:12px;color:var(--muted);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pc-shop{font-size:11.5px;color:#7c74a0;margin-top:2px}
.empty{text-align:center;padding:50px 10px}
.psearchbar{margin-top:10px}
/* skeleton */
.pcimg-wrap.sk{background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sh 1.2s infinite}
.pcard .skln{height:12px;border-radius:6px;background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sh 1.2s infinite;margin:4px 0}
.pcard .skln.sm{width:60%}
/* product page big image */
.pbig{width:100%;aspect-ratio:1/1;max-height:460px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:16px}

/* ============ PREMIUM SHOP/PRODUCT ANIMATIONS (v24) ============ */
@keyframes nmRise { from{opacity:0;transform:translateY(24px) scale(.97)} to{opacity:1;transform:none} }
@keyframes nmShimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
@keyframes nmFadeIn { from{opacity:0} to{opacity:1} }
@keyframes nmPop { 0%{transform:scale(.8);opacity:0} 60%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }

/* product grid cards — staggered entrance */
.pgrid .pcard{ animation: nmRise .5s cubic-bezier(.22,.61,.36,1) both; }
.pgrid .pcard:nth-child(1){animation-delay:.02s}.pgrid .pcard:nth-child(2){animation-delay:.06s}
.pgrid .pcard:nth-child(3){animation-delay:.10s}.pgrid .pcard:nth-child(4){animation-delay:.14s}
.pgrid .pcard:nth-child(5){animation-delay:.18s}.pgrid .pcard:nth-child(6){animation-delay:.22s}
.pgrid .pcard:nth-child(7){animation-delay:.26s}.pgrid .pcard:nth-child(8){animation-delay:.30s}
.pgrid .pcard:nth-child(n+9){animation-delay:.34s}

/* card hover — lift + shadow + image zoom */
.pcard{ transition: transform .28s cubic-bezier(.22,.61,.36,1), box-shadow .28s; will-change:transform; }
.pcard:hover{ transform: translateY(-8px); box-shadow: 0 18px 40px -12px rgba(122,47,247,.28); }
.pcard:active{ transform: translateY(-3px) scale(.99); }
.pcimg-wrap{ overflow:hidden; }
.pcimg{ transition: transform .5s cubic-bezier(.22,.61,.36,1); }
.pcard:hover .pcimg{ transform: scale(1.09); }
.off-tag{ animation: nmPop .4s .3s both; }

/* offer tag shine sweep on hover */
.pcard:hover .off-tag{ box-shadow:0 2px 12px rgba(255,46,126,.5); }

/* shimmer skeleton (loading) */
.pcimg-wrap.sk, .skln{
  background:linear-gradient(90deg,#efeaf7 25%,#f7f3fd 37%,#efeaf7 63%);
  background-size:800px 100%; animation: nmShimmer 1.3s infinite linear; border-radius:10px;
}
.skln{height:12px;margin:7px 0}.skln.sm{height:9px;width:60%}

/* search result shop cards — slide-in stagger + hover slide */
.container > a > .card.row{ animation: nmRise .45s cubic-bezier(.22,.61,.36,1) both;
  transition: transform .25s ease, box-shadow .25s ease; }
.container > a:nth-of-type(1) > .card{animation-delay:.02s}
.container > a:nth-of-type(2) > .card{animation-delay:.07s}
.container > a:nth-of-type(3) > .card{animation-delay:.12s}
.container > a:nth-of-type(4) > .card{animation-delay:.17s}
.container > a:nth-of-type(n+5) > .card{animation-delay:.22s}
.container > a > .card.row:hover{ transform: translateX(6px); box-shadow:0 10px 26px -10px rgba(122,47,247,.25); }
.container > a > .card.row:hover img{ transform:scale(1.08); transition:transform .35s; }

/* landing hero slide — smoother */
.empty{ animation: nmFadeIn .5s both; }

/* respect reduced-motion users */
@media (prefers-reduced-motion: reduce){
  .pgrid .pcard,.container>a>.card.row,.off-tag,.empty{animation:none!important}
  .pcard:hover{transform:none} .pcard:hover .pcimg{transform:none}
}

/* ===== Dynamic contact / social buttons (shop page) ===== */
.socrow{ display:flex; flex-wrap:wrap; gap:9px; margin-top:12px; }
.socpill{ display:inline-flex; align-items:center; gap:7px; flex:0 0 auto;
  padding:9px 14px; border-radius:24px; color:#fff; font-weight:700; font-size:13.5px;
  text-decoration:none; white-space:nowrap; box-shadow:0 3px 10px rgba(0,0,0,.16);
  transition:transform .16s ease, box-shadow .16s ease, filter .16s ease; }
.socpill:hover{ transform:translateY(-2px); box-shadow:0 7px 18px rgba(0,0,0,.24); filter:brightness(1.05); }
.socpill:active{ transform:translateY(0) scale(.97); }
.socpill-ic{ display:inline-flex; align-items:center; }
.socpill-ic svg{ display:block; }

/* ===== Owner dashboard: contact & social editor ===== */
.socgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:9px; }
.socbtn{ display:flex !important; align-items:center; gap:10px; text-align:left;
  padding:10px 12px !important; justify-content:flex-start !important; }
.socbtn-ic{ font-size:20px; line-height:1; }
.socbtn-tx{ display:flex; flex-direction:column; line-height:1.25; flex:1; min-width:0; }
.socbtn-tx small{ font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.socbtn-ed{ font-size:12px; font-weight:700; color:var(--brand,#6d28d9); opacity:.9; }

/* Cold-start "server waking" banner */
.wakebanner{ background:linear-gradient(90deg,#fff4e0,#ffe9cc); border:1px solid #ffd28a;
  color:#8a5a00; padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:10px;
  line-height:1.4; }

/* Big prominent "5 star review" button on the scan/landing page */
.reviewbtn{ display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:18px 16px; border-radius:16px; text-decoration:none;
  background:linear-gradient(135deg,#FFC107,#FF9800);
  color:#3a2a00; box-shadow:0 6px 18px rgba(255,152,0,.35);
  transition:transform .15s ease, box-shadow .15s ease; }
.reviewbtn:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(255,152,0,.45); }
.reviewbtn:active{ transform:translateY(0) scale(.98); }
.reviewbtn-stars{ font-size:40px; line-height:1; letter-spacing:4px; color:#fff;
  text-shadow:0 2px 4px rgba(0,0,0,.18); animation:nmStarPulse 1.6s ease-in-out infinite; }
.reviewbtn-tx{ font-size:18px; font-weight:800; }
.reviewbtn-sub{ font-size:12.5px; font-weight:600; opacity:.85; }
@keyframes nmStarPulse{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.06) } }
@media (prefers-reduced-motion: reduce){ .reviewbtn-stars{ animation:none } }

/* Thank-you box after review */
.thankbox{ background:linear-gradient(90deg,#e9fbf1,#d7f7e6); border:1px solid #9fe3c0;
  color:#0b7a4a; padding:12px 14px; border-radius:12px; font-size:14px; font-weight:600;
  line-height:1.45; animation:nmFadeIn .3s ease; }

/* Inline star picker (NammaOor review) */
.ratepick{ background:linear-gradient(135deg,#fff7e6,#ffeccc); border:2px solid #FFC107;
  border-radius:16px; padding:14px; text-align:center; }
.ratepick-tx{ font-weight:800; color:#8a5a00; margin:0 0 8px; }
.ratepick-stars{ display:flex; justify-content:center; gap:6px; }
.ratepick-star{ font-size:44px; line-height:1; color:#FFB300; background:none; border:none;
  cursor:pointer; padding:2px 4px; transition:transform .12s ease; animation:starPop .4s ease both; }
.ratepick-star:hover{ transform:scale(1.25) rotate(-6deg); color:#FF9800; }
.ratepick-star:active{ transform:scale(.9); }
@keyframes starPop{ from{ transform:scale(0); opacity:0 } to{ transform:scale(1); opacity:1 } }

/* Celebration overlay after review */
.celebrate{ position:fixed; inset:0; z-index:9999; pointer-events:none; overflow:hidden;
  background:rgba(20,10,40,.28); backdrop-filter:blur(1px); animation:nmFadeIn .2s ease; }
.celebrate-burst{ position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
  text-align:center; animation:burstPop .6s cubic-bezier(.2,1.4,.4,1) both; }
.celebrate-star{ font-size:96px; line-height:1; filter:drop-shadow(0 6px 18px rgba(255,152,0,.6));
  animation:spinStar 1.6s ease; }
.celebrate-msg{ font-size:30px; font-weight:900; color:#fff; margin-top:6px;
  text-shadow:0 3px 14px rgba(0,0,0,.35); }

/* ============ PREMIUM SHOP/PRODUCT ANIMATIONS (v24) ============ */
@keyframes nmRise { from{opacity:0;transform:translateY(24px) scale(.97)} to{opacity:1;transform:none} }
@keyframes nmShimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
@keyframes nmFadeIn { from{opacity:0} to{opacity:1} }
@keyframes nmPop { 0%{transform:scale(.8);opacity:0} 60%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }

/* product grid cards — staggered entrance */
.pgrid .pcard{ animation: nmRise .5s cubic-bezier(.22,.61,.36,1) both; }
.pgrid .pcard:nth-child(1){animation-delay:.02s}.pgrid .pcard:nth-child(2){animation-delay:.06s}
.pgrid .pcard:nth-child(3){animation-delay:.10s}.pgrid .pcard:nth-child(4){animation-delay:.14s}
.pgrid .pcard:nth-child(5){animation-delay:.18s}.pgrid .pcard:nth-child(6){animation-delay:.22s}
.pgrid .pcard:nth-child(7){animation-delay:.26s}.pgrid .pcard:nth-child(8){animation-delay:.30s}
.pgrid .pcard:nth-child(n+9){animation-delay:.34s}

/* card hover — lift + shadow + image zoom */
.pcard{ transition: transform .28s cubic-bezier(.22,.61,.36,1), box-shadow .28s; will-change:transform; }
.pcard:hover{ transform: translateY(-8px); box-shadow: 0 18px 40px -12px rgba(122,47,247,.28); }
.pcard:active{ transform: translateY(-3px) scale(.99); }
.pcimg-wrap{ overflow:hidden; }
.pcimg{ transition: transform .5s cubic-bezier(.22,.61,.36,1); }
.pcard:hover .pcimg{ transform: scale(1.09); }
.off-tag{ animation: nmPop .4s .3s both; }

/* offer tag shine sweep on hover */
.pcard:hover .off-tag{ box-shadow:0 2px 12px rgba(255,46,126,.5); }

/* shimmer skeleton (loading) */
.pcimg-wrap.sk, .skln{
  background:linear-gradient(90deg,#efeaf7 25%,#f7f3fd 37%,#efeaf7 63%);
  background-size:800px 100%; animation: nmShimmer 1.3s infinite linear; border-radius:10px;
}
.skln{height:12px;margin:7px 0}.skln.sm{height:9px;width:60%}

/* search result shop cards — slide-in stagger + hover slide */
.container > a > .card.row{ animation: nmRise .45s cubic-bezier(.22,.61,.36,1) both;
  transition: transform .25s ease, box-shadow .25s ease; }
.container > a:nth-of-type(1) > .card{animation-delay:.02s}
.container > a:nth-of-type(2) > .card{animation-delay:.07s}
.container > a:nth-of-type(3) > .card{animation-delay:.12s}
.container > a:nth-of-type(4) > .card{animation-delay:.17s}
.container > a:nth-of-type(n+5) > .card{animation-delay:.22s}
.container > a > .card.row:hover{ transform: translateX(6px); box-shadow:0 10px 26px -10px rgba(122,47,247,.25); }
.container > a > .card.row:hover img{ transform:scale(1.08); transition:transform .35s; }

/* landing hero slide — smoother */
.empty{ animation: nmFadeIn .5s both; }

/* respect reduced-motion users */
@media (prefers-reduced-motion: reduce){
  .pgrid .pcard,.container>a>.card.row,.off-tag,.empty{animation:none!important}
  .pcard:hover{transform:none} .pcard:hover .pcimg{transform:none}
}

// GET with retry — recovers automatically from a cold (sleeping) free-tier server.
// Render free tier returns 503 for ~50s while waking, so we retry for ~2 min.
async function getRetry(path, tries=40, gap=3000){
  let last
  for(let i=0;i<tries;i++){
    try{ return await api.get(path) }
    catch(e){ last=e; await new Promise(r=>setTimeout(r, gap)) }
  }
  throw last
}

// ================= Mini Browser (optional, lightweight) =================
// Floating button -> draggable/resizable popup. Embeddable links (YouTube video,
// Google Maps) open INSIDE; blocked sites (Instagram/FB/WhatsApp/YouTube home/
// Google Reviews) auto-open in a NEW TAB (no error shown).
const MB_KEY='nm_mini_recents'
const mbRecents=()=>{ try{return JSON.parse(localStorage.getItem(MB_KEY)||'[]')}catch(e){return[]} }
const mbSave=(label,url)=>{ const r=mbRecents().filter(x=>x.url!==url); r.unshift({label,url,at:Date.now()})
  localStorage.setItem(MB_KEY,JSON.stringify(r.slice(0,10))) }
const MB_BLOCKED=/instagram\.com|facebook\.com|fb\.com|wa\.me|whatsapp\.com|twitter\.com|x\.com|linkedin\.com|(www\.)?google\.[a-z.]+|youtube\.com\/(?!embed)|youtu\.be/i
function mbEmbedUrl(u){
  let url=(u||'').trim(); if(!url) return null
  // NammaOor pages: '#/...' or '/...' or full nammaoor.shop link -> open inside
  if(url.startsWith('#')) return location.origin+'/'+url
  if(url.startsWith('/')) return location.origin+url
  if(!/^https?:\/\//i.test(url)) url='https://'+url
  if(/nammaoor\.shop|nammaoor-site\.pages\.dev/i.test(url)) return url
  // YouTube watch/short link -> embeddable player
  let m=url.match(/youtube\.com\/watch\?.*v=([\w-]{6,})/i)||url.match(/youtu\.be\/([\w-]{6,})/i)
  if(m) return 'https://www.youtube.com/embed/'+m[1]
  // Google Maps -> embed output
  if(/google\.[a-z.]+\/maps|maps\.google/i.test(url)){
    const q=url.match(/[?&]q=([^&]+)/); return 'https://maps.google.com/maps?q='+(q?q[1]:'')+'&output=embed' }
  if(MB_BLOCKED.test(url)) return null      // known blockers -> new tab
  return url
}
function MiniBrowser(){
  const [open,setOpen]=useState(false)
  const [url,setUrl]=useState(''); const [cur,setCur]=useState('')
  const [hist,setHist]=useState([]); const [hi,setHi]=useState(-1)
  const [full,setFull]=useState(false); const [rec,setRec]=useState(mbRecents())
  const [pos,setPos]=useState({x:null,y:null}); const drag=useRef(null)
  const frameRef=useRef(null)
  // draggable FAB (remembers position) + resizable window (touch-friendly)
  const [fabPos,setFabPos]=useState(()=>{ try{return JSON.parse(localStorage.getItem('nm_mini_fabpos')||'null')}catch(e){return null} })
  const fabDrag=useRef(null)
  const [size,setSize]=useState({w:null,h:null}); const rsz=useRef(null)
  const fabDown=(e)=>{ const t=e.touches?e.touches[0]:e
    const r=e.currentTarget.getBoundingClientRect()
    fabDrag.current={sx:t.clientX,sy:t.clientY,px:r.left,py:r.top,moved:false}
    const mv=(ev)=>{ const p=ev.touches?ev.touches[0]:ev
      const dx=p.clientX-fabDrag.current.sx, dy=p.clientY-fabDrag.current.sy
      if(Math.abs(dx)>6||Math.abs(dy)>6) fabDrag.current.moved=true
      if(fabDrag.current.moved){ if(ev.cancelable)ev.preventDefault()
        const nx=Math.min(window.innerWidth-64,Math.max(4,fabDrag.current.px+dx))
        const ny=Math.min(window.innerHeight-64,Math.max(4,fabDrag.current.py+dy))
        setFabPos({x:nx,y:ny}) } }
    const up=()=>{ window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up)
      window.removeEventListener('touchmove',mv); window.removeEventListener('touchend',up)
      if(fabDrag.current.moved){ try{localStorage.setItem('nm_mini_fabpos',JSON.stringify({x:fabDrag.current.px,y:fabDrag.current.py}))}catch(e){}
        setFabPos(f=>{ try{localStorage.setItem('nm_mini_fabpos',JSON.stringify(f))}catch(e){}; return f }) }
      else setOpen(true) }
    window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up)
    window.addEventListener('touchmove',mv,{passive:false}); window.addEventListener('touchend',up)
  }
  const rszDown=(e)=>{ e.stopPropagation(); const t=e.touches?e.touches[0]:e
    const el=e.currentTarget.parentElement.getBoundingClientRect()
    rsz.current={sx:t.clientX,sy:t.clientY,w:el.width,h:el.height}
    const mv=(ev)=>{ if(ev.cancelable)ev.preventDefault(); const p=ev.touches?ev.touches[0]:ev
      setSize({w:Math.max(260,rsz.current.w+p.clientX-rsz.current.sx),
               h:Math.max(300,rsz.current.h+p.clientY-rsz.current.sy)}) }
    const up=()=>{ window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up)
      window.removeEventListener('touchmove',mv); window.removeEventListener('touchend',up) }
    window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up)
    window.addEventListener('touchmove',mv,{passive:false}); window.addEventListener('touchend',up)
  }
  // top-left resize (bottom-right anchored)
  const rszDownTL=(e)=>{ e.stopPropagation(); const t=e.touches?e.touches[0]:e
    const el=e.currentTarget.parentElement.getBoundingClientRect()
    rsz.current={sx:t.clientX,sy:t.clientY,w:el.width,h:el.height,r:el.right,b:el.bottom}
    const mv=(ev)=>{ if(ev.cancelable)ev.preventDefault(); const p=ev.touches?ev.touches[0]:ev
      const w=Math.max(260,rsz.current.w-(p.clientX-rsz.current.sx))
      const h=Math.max(300,rsz.current.h-(p.clientY-rsz.current.sy))
      setSize({w,h}); setPos({x:Math.max(0,rsz.current.r-w), y:Math.max(0,rsz.current.b-h)}) }
    const up=()=>{ window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up)
      window.removeEventListener('touchmove',mv); window.removeEventListener('touchend',up) }
    window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up)
    window.addEventListener('touchmove',mv,{passive:false}); window.addEventListener('touchend',up)
  }
  // ---- Contacts tool (saved numbers + one-tap call) ----
  const [contacts,setContacts]=useState(()=>{ try{return JSON.parse(localStorage.getItem('nm_mini_contacts')||'[]')}catch(e){return[]} })
  const [cName,setCName]=useState(''); const [cNum,setCNum]=useState('')
  const saveContacts=(list)=>{ setContacts(list); try{localStorage.setItem('nm_mini_contacts',JSON.stringify(list))}catch(e){} }
  const addContact=()=>{ const n=cName.trim(), d=cNum.replace(/\D/g,'')
    if(!n||d.length<10) return
    saveContacts([{name:n,num:d},...contacts.filter(c=>c.num!==d)]); setCName(''); setCNum('') }
  const delContact=(i)=>saveContacts(contacts.filter((_,ix)=>ix!==i))
  const importContacts=async()=>{
    try{
      if(!('contacts' in navigator && navigator.contacts.select)){ alert('Intha phone browser contact import support pannala. Manual-a add pannunga.'); return }
      const picked=await navigator.contacts.select(['name','tel'],{multiple:true})
      const add=picked.map(c=>({name:(c.name&&c.name[0])||'Contact', num:((c.tel&&c.tel[0])||'').replace(/\D/g,'')})).filter(c=>c.num.length>=10)
      if(add.length) saveContacts([...add,...contacts.filter(c=>!add.some(a=>a.num===c.num))])
    }catch(e){}
  }
  const go=(label,raw)=>{
    setTool(null)
    const emb=mbEmbedUrl(raw)
    mbSave(label||raw, raw); setRec(mbRecents())
    if(!emb){ window.open(/^https?:/i.test(raw)?raw:'https://'+raw,'_blank','noopener'); return }
    const h=hist.slice(0,hi+1); h.push(emb); setHist(h); setHi(h.length-1); setCur(emb)
  }
  const back=()=>{ if(hi>0){ setHi(hi-1); setCur(hist[hi-1]) } }
  const fwd =()=>{ if(hi<hist.length-1){ setHi(hi+1); setCur(hist[hi+1]) } }
  const refresh=()=>{ if(frameRef.current) frameRef.current.src=cur }
  const links=[
    ['🔍 Search','https://lite.duckduckgo.com/lite/'],
    ['▶️ YouTube','https://www.youtube.com'],
    ['📷 Instagram','https://www.instagram.com'],
    ['📘 Facebook','https://www.facebook.com'],
    ['💬 WhatsApp','https://web.whatsapp.com'],
    ['🗺️ Maps','https://maps.google.com/maps?q=tamil+nadu&output=embed'],
    ['🌐 Google','https://www.google.com'],
  ]
  const apps=[['💳 GPay','tez://upi/','https://gpay.app.goo.gl']]
  const openApp=(scheme,fallback)=>{
    const t=Date.now()
    try{ window.location.href=scheme }catch(e){}
    setTimeout(()=>{ if(Date.now()-t<1600 && !document.hidden) window.open(fallback,'_blank','noopener') },1200)
  }
  // ---- built-in tools: Calculator + Notes (auto-saved) ----
  const [tool,setTool]=useState(null)                 // null | 'calc' | 'notes'
  const [expr,setExpr]=useState(''); const [calcRes,setCalcRes]=useState('')
  const [notes,setNotes]=useState(()=>{ try{return localStorage.getItem('nm_mini_notes')||''}catch(e){return ''} })
  const saveNotes=(v)=>{ setNotes(v); try{localStorage.setItem('nm_mini_notes',v)}catch(e){} }
  const calcPress=(k)=>{
    if(k==='C'){ setExpr(''); setCalcRes(''); return }
    if(k==='⌫'){ setExpr(e=>e.slice(0,-1)); return }
    if(k==='='){
      try{ const safe=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/%/g,'/100')
        if(!/^[0-9+\-*/(). ]+$/.test(safe)){ setCalcRes('Err'); return }
        const v=Function('"use strict";return ('+safe+')')()
        setCalcRes(Number.isFinite(v)?String(Math.round(v*10000)/10000):'Err') }catch(e){ setCalcRes('Err') }
      return }
    setExpr(e=>e+k)
  }
  const openTool=(t)=>{ setTool(t); setCur(''); }
  const onDown=(e)=>{ const t=e.touches?e.touches[0]:e
    drag.current={sx:t.clientX,sy:t.clientY,px:pos.x??(window.innerWidth-380),py:pos.y??(window.innerHeight-560)}
    const mv=(ev)=>{ const p=ev.touches?ev.touches[0]:ev
      setPos({x:Math.max(0,drag.current.px+p.clientX-drag.current.sx), y:Math.max(0,drag.current.py+p.clientY-drag.current.sy)}) }
    const up=()=>{ window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up)
      window.removeEventListener('touchmove',mv); window.removeEventListener('touchend',up) }
    window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up)
    window.addEventListener('touchmove',mv); window.addEventListener('touchend',up)
  }
  if(!open) return <button className="mbfab" title="Mini Screen"
    style={fabPos?{left:fabPos.x,top:fabPos.y,right:'auto',bottom:'auto'}:undefined}
    onMouseDown={fabDown} onTouchStart={fabDown}>📺<span>Mini</span></button>
  const style=full?{inset:0,width:'auto',height:'auto',borderRadius:0}
    :{left:pos.x??undefined,top:pos.y??undefined,right:pos.x==null?12:undefined,bottom:pos.y==null?12:undefined,
      width:size.w||undefined,height:size.h||undefined,maxWidth:size.w?'none':undefined,maxHeight:size.h?'none':undefined}
  return (<div className={'mbwin'+(full?' full':'')} style={style}>
    <div className="mbbar" onMouseDown={onDown} onTouchStart={onDown}>
      <span className="mbtitle">📺 NammaOor Mini</span>
      <span className="mbbtns">
        <button onClick={back} disabled={hi<=0}>◀</button>
        <button onClick={fwd} disabled={hi>=hist.length-1}>▶</button>
        <button onClick={refresh} disabled={!cur}>⟳</button>
        <button onClick={()=>setFull(f=>!f)}>{full?'🗗':'⛶'}</button>
        <button onClick={()=>{setOpen(false);setFull(false)}}>✕</button>
      </span>
    </div>
    {!tool && <>
      <div className="mbquick">
        <button style={{background:'#fff4e0',borderColor:'#ffd9a0'}} onClick={()=>openTool('calc')}>🧮 Calculator</button>
        <button style={{background:'#eafaf4',borderColor:'#b8ecd7'}} onClick={()=>openTool('notes')}>📝 Notes</button>

      </div>
      <div className="mburl">
        <input placeholder="Link paste pannunga (YouTube video / Maps...)" value={url}

        <button onClick={()=>{if(url.trim()){go(null,url.trim());setUrl('')}}}>Go</button>
      </div>
    </>}
    {tool && <div className="mbtoolbar">
      <button onClick={()=>setTool(null)}>← Back</button>
      <b>{tool==='calc'?'🧮 Calculator':tool==='notes'?'📝 Notes':'📞 Contacts'}</b>
      <span style={{width:60}}></span>
    </div>}
    {tool==='calc'
      ? <div className="mbcalc">
          <div className="mbcalc-display">
            <div className="mbcalc-expr">{expr||'0'}</div>
            <div className="mbcalc-res">{calcRes!==''?('= '+calcRes):''}</div>
          </div>
          <div className="mbcalc-grid">
            {['C','⌫','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','00','0','.','='].map(k=>(
              <button key={k} className={'mbcalc-k'+(k==='='?' eq':'')+(['C','⌫','%','÷','×','-','+'].includes(k)?' op':'')}
                onClick={()=>calcPress(k)}>{k}</button>))}
          </div>
        </div>
      : tool==='contacts'
      ? <div className="mbcontacts">
          <div className="row" style={{gap:6}}>
            <input className="input" style={{flex:1,margin:0}} placeholder="Name" value={cName} onChange={e=>setCName(e.target.value)}/>

            {contacts.map((c,i)=>(
              <div key={i} style={{display:'flex',alignItems:'center',gap:8,borderBottom:'1px solid var(--line)',padding:'8px 0'}}>
                <div style={{flex:1,minWidth:0}}><b style={{fontSize:14}}>{c.name}</b><br/><span className="muted" style={{fontSize:12}}>{c.num}</span></div>
                <a href={'tel:'+c.num} className="btn sm tl" style={{textDecoration:'none'}}>📞 Call</a>
                <button className="btn sm ghost" onClick={()=>delContact(i)}>✕</button>
              </div>))}
          </div>
        </div>
      : tool==='notes'
      ? <div className="mbnotes">
          <p className="muted" style={{fontSize:12,margin:'0 0 6px'}}>📝 Notes — auto save aagum (indha phone-la mattum)</p>
          <textarea value={notes} onChange={e=>saveNotes(e.target.value)}
            placeholder="Ethavadhu note pannunga... (kadai list, amounts, ninaivugal)"></textarea>
          <p className="muted" style={{fontSize:11,margin:'4px 0 0',textAlign:'right'}}>{notes.length} chars · ✅ saved</p>
        </div>
      : cur
      ? <iframe ref={frameRef} src={cur} className="mbframe"
          allow="autoplay; encrypted-media; picture-in-picture; payment *; geolocation *; camera *"
          allowFullScreen></iframe>
      : <div className="mbhome">
          <p className="muted" style={{fontSize:12.5}}>Mela irukura link-a thattunga, allathu oru link paste pannunga.</p>
          {rec.length>0 && <>
            <b style={{fontSize:13}}>🕘 Recent</b>
            {rec.map((r,i)=><a key={i} onClick={()=>go(r.label,r.url)}>{r.label||r.url}</a>)}
          </>}
        </div>}
    {!full && <div className="mbgrip" onMouseDown={rszDown} onTouchStart={rszDown} title="Resize">◢</div>}
    {!full && <div className="mbgrip-tl" onMouseDown={rszDownTL} onTouchStart={rszDownTL} title="Resize">◤</div>}

}

  // Normal (not logged-in) users -> stay on this home page.

    const r=getRole(); const t=(typeof localStorage!=='undefined')?localStorage.getItem('token'):''
    if(t && r){
      const p = r==='super_admin'?'admin' : r==='shop_owner'?'owner' : r==='employee'?'employee' : ''
      if(p) window.location.hash='#/app/'+p
    }
  },[])
  useEffect(()=>{ const t=setInterval(()=>setI(p=>(p+1)%SLIDES.length),3000); return ()=>clearInterval(t) },[])
  const nav=useNavigate()
  const [shops,setShops]=useState([]); const [nearOn,setNearOn]=useState(false); const [geoMsg,setGeoMsg]=useState('')
  // recent/random shops on home (no forced GPS prompt)
  useEffect(()=>{ api.get('/search').then(r=>{ if(r&&r.length){ const a=[...r].sort(()=>Math.random()-0.5); setShops(a.slice(0,8)) } }).catch(()=>{}) },[])
  const nearMe=()=>{

    if(!navigator.geolocation){ setGeoMsg('❌ Intha browser location support pannala. Chrome/Safari-la open pannunga.'); return }

      p=>{ api.get(`/search/near?lat=${p.coords.latitude}&lng=${p.coords.longitude}&radius_km=30`)
            .then(r=>{ if(r){ setShops(r.slice(0,12)); setNearOn(true); setGeoMsg(r.length?'':'30km-la kadai illa.') } })
            .catch(()=>setGeoMsg('Search fail. Marupadi try pannunga.')) },
      err=>{ setGeoMsg(err && err.code===1
        ? '❌ Location block aayirukku. Address bar-la 🔒 (lock) → Location → "Allow" → marupadi 📍 Near me thattunga. (Phone-la: Settings → Site → Location Allow)'
        : '❌ Location edukka mudiyala. Phone-la GPS/Location ON pannunga, appuram try pannunga.') },
      {enableHighAccuracy:true,timeout:15000,maximumAge:0}) }
  const s=SLIDES[i]
  return (<>

    <div className="container">
      <div style={{position:'relative',borderRadius:20,overflow:'hidden',minHeight:230,
        background:s.g,transition:'background .6s ease',color:'#fff',

        <div key={i} style={{animation:'nmFade .6s ease'}}>
          <div style={{fontSize:56,lineHeight:1}}>{s.icon}</div>
          <h1 style={{fontSize:30,fontWeight:800,margin:'12px 0 6px'}}>{s.title}</h1>
          <p style={{maxWidth:420,margin:'0 auto',opacity:.95,fontSize:15}}>{s.sub}</p>
        </div>
        <div style={{display:'flex',gap:8,marginTop:20}}>
          {SLIDES.map((_,k)=><span key={k} onClick={()=>setI(k)} style={{width:k===i?22:9,height:9,
            borderRadius:9,background:k===i?'#fff':'rgba(255,255,255,.5)',transition:'all .3s',cursor:'pointer'}}/>)}
        </div>
      </div>
      <style>{'@keyframes nmFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}'}</style>

      <div style={{textAlign:'center',marginTop:22}}>
        <img src="/logo.png" style={{height:70,display:'block',margin:'0 auto'}}/>
      </div>

      <div className="row" style={{justifyContent:'center',marginTop:16}}>
        <Link to="/search"><button className="btn">🔍 கடைகளை தேடு</button></Link>
        <Link to="/register"><button className="btn ghost">🏪 கடை பதிவு</button></Link>
      </div>

      {shops.length>0 && <div style={{marginTop:22}}>
        <div className="row" style={{justifyContent:'space-between',alignItems:'center'}}>
          <h3 style={{margin:0}}>🏪 {nearOn?'Pakkathula Kadaigal':'NammaOor Kadaigal'}</h3>
          <a style={{cursor:'pointer',color:'var(--purple)',fontWeight:700}} onClick={nearMe}>📍 Near me</a>
        </div>
        {geoMsg && <p className="muted" style={{marginTop:6,fontSize:13,lineHeight:1.4}}>{geoMsg}</p>}
        <div className="shopgrid">
          {shops.map(s=>(
            <div key={s.shop_code} className="shopcard" onClick={()=>nav('/shop/'+(s.shop_code||'').replace('-',''))}>
              <div className="shopcard-img">
                {s.logo_url?<img src={s.logo_url} onError={onImgErr}/>:<span style={{fontSize:56}}>{catIcon(s.category,s.category)}</span>}
                {s.reviews>0 && <span className="shopcard-rate">⭐ {s.rating}</span>}
                {s.distance_km!=null && <span className="shopcard-dist">📍 {s.distance_km} km</span>}
              </div>
              <div className="shopcard-body">
                <b className="shopcard-name">{s.shop_name}</b>
                <span className="muted" style={{fontSize:12}}>{s.category||'Shop'}{s.town?(' · '+s.town):''}</span>
              </div>
            </div>))}
        </div>
      </div>}

      {/* role cards at the BOTTOM (secondary) */}
      <p className="muted" style={{textAlign:'center',marginTop:24,marginBottom:2,fontWeight:600}}>Neenga yaaru?</p>
      <div className="grid3">
        <Link to="/search"><div className="card rolecard"><div style={{fontSize:26}}>🙋</div><b>Customer</b><span className="muted">Scan · Pay · Reviews</span></div></Link>
        <Link to="/login"><div className="card rolecard"><div style={{fontSize:26}}>🧑‍💼</div><b>Shop Owner</b><span className="muted">Products · Offers · QR</span></div></Link>
        <Link to="/login"><div className="card rolecard"><div style={{fontSize:26}}>👷</div><b>Employee</b><span className="muted">Register · ₹100</span></div></Link>
      </div>
      <p className="muted" style={{textAlign:'center',marginTop:18}}>Powered by NammaOor</p>
      <p className="muted" style={{textAlign:'center',fontSize:12,marginTop:2}}>
        <a href="#/terms">Terms</a> · <a href="#/privacy">Privacy</a></p>
    </div>
  </>)
}

function Register(){
  const _h = (typeof window!=='undefined' && window.location.hash) || ''
  const _q = _h.includes('?') ? _h.split('?')[1] : (typeof window!=='undefined' ? window.location.search.slice(1) : '')
  const empParam = new URLSearchParams(_q).get('emp')          // present => an employee is registering
  const emp = empParam || ''
  // Entry chooser: no ?emp => came from "Kadai Pathivu" => ask Own / Other first.
  const [mode,setMode]=useState(empParam ? 'form' : 'choose')
  const [districts,setD]=useState(NM_DISTRICTS); const [assemblies,setA]=useState([]); const [cats,setC]=useState([])
  const [loadingCat,setLoadingCat]=useState(true); const [loadingAsm,setLoadingAsm]=useState(false)
  const [pw2,setPw2]=useState('')
  const [f,setF]=useState({emp_code:emp,own_shop:!empParam,owner_password:'',shop_name:'',owner_name:'',mobile:'',whatsapp:'',
    district_id:'',assembly_id:'',town:'',area:'',category_id:'',address:'',google_maps:'',
    lat:null,lng:null,description:'',bio:'',open_time:'',close_time:'',leave_days:'',upi_id:'',facebook:'',instagram:'',website:'',logo_url:'',cover_url:'',photos:[]})
  const [products,setProducts]=useState([]); const [pf,setPf]=useState({name:'',price:''})
  const [shopId,setShopId]=useState(localStorage.getItem('draft_id')||null)
  const [step,setStep]=useState('form'); const [otp,setOtp]=useState('')
  const [token,setTok]=useState(''); const [msg,setMsg]=useState(''); const [result,setResult]=useState(null)
  const [scanning,setScanning]=useState(false); const videoRef=useRef(null)
  const set=(k)=>(e)=>setF({...f,[k]:e.target.value})

  // ---- Resume registration after interruption (call / app switch / iPhone tab kill) ----
  useEffect(()=>{
    try{
      const sf=JSON.parse(localStorage.getItem('reg_form')||'null')
      if(sf && sf.shop_name){ setF(v=>({...v,...sf,owner_password:''})); setMode('form') }
      const sp=JSON.parse(localStorage.getItem('reg_products')||'null')
      if(sp && sp.length) setProducts(sp)
    }catch(e){}
  },[])
  // Auto-save form (except password) so nothing is lost if the page closes
  useEffect(()=>{ try{ localStorage.setItem('reg_form', JSON.stringify({...f,owner_password:''})) }catch(e){} },[f])
  useEffect(()=>{ try{ localStorage.setItem('reg_products', JSON.stringify(products)) }catch(e){} },[products])

  useEffect(()=>{
    // Districts already shown from embedded data; refresh from server (authoritative) when awake.
    getRetry('/geo/districts').then(d=>{ if(d&&d.length) setD(d) }).catch(()=>{})
    setLoadingCat(true)
    getRetry('/geo/categories').then(c=>{ if(c&&c.length) setC(c); setLoadingCat(false) }).catch(()=>setLoadingCat(false))
  },[])
  useEffect(()=>{ if(!f.district_id){ setA([]); return }
    setLoadingAsm(true); setA([])
    getRetry('/geo/assemblies?district_id='+f.district_id).then(a=>{ setA(a||[]); setLoadingAsm(false) }).catch(()=>setLoadingAsm(false))
  },[f.district_id])

  function grabLocation(){
    if(!navigator.geolocation){ setMsg('Location support illa. Address manual-aa podunga.'); return }
    setMsg('📍 Location edukkirathu… (konjam neram)')
    const ok=p=>{ const {latitude:lat,longitude:lng}=p.coords
      setF(v=>({...v,lat,lng,google_maps:`https://maps.google.com/?q=${lat},${lng}`}))
      setMsg(`✅ Location saved: ${lat.toFixed(4)}, ${lng.toFixed(4)}`) }
    const fail=(e)=>{
      // low-accuracy retry before giving up
      navigator.geolocation.getCurrentPosition(ok,
        ()=>setMsg('❌ Location edukka mudiyala. Phone-la location ON pannunga, allathu address manual-aa podunga.'),
        {enableHighAccuracy:false,timeout:20000,maximumAge:120000})
    }
    navigator.geolocation.getCurrentPosition(ok, fail, {enableHighAccuracy:true,timeout:12000,maximumAge:30000})
  }
  const addProduct=()=>{ if(pf.name){ setProducts([...products,pf]); setPf({name:'',price:''}) } }
  async function saveDraft(){
    try{ const b={...f,district_id:f.district_id?+f.district_id:null,
        assembly_id:f.assembly_id?+f.assembly_id:null,category_id:f.category_id?+f.category_id:null}
      let id=shopId
      if(id){ await api.patch(`/shops/${id}/draft`,b) }
      else { const r=await api.post('/shops/draft',b); id=r.id; setShopId(id); localStorage.setItem('draft_id',id) }
      setMsg('Draft saved'); return id }catch(e){ setMsg('Error: '+e.message); return null }
  }
  async function payNow(){
    if((f.owner_password||'').length<6){ setMsg('Password podunga (min 6 characters)'); return }
    if(f.owner_password!==pw2){ setMsg('Password rendum match aagala'); return }
    const id=await saveDraft(); if(!id) return
    for(const p of products){ try{ await api.post(`/shops/${id}/product`,{name:p.name,price:p.price?+p.price:null}) }catch{} }
    // Preferred: Rs.1 today + Rs.99/month UPI Autopay
    try{
      const sub=await api.post('/payments/subscription/create',{shop_id:id})
      if(sub.subscription_id && window.Razorpay){
        const rzp=new window.Razorpay({
          key:sub.key_id, subscription_id:sub.subscription_id,
          name:'NammaOor', description:'Registration ₹1 · then ₹99/month autopay',
          prefill:{contact:f.mobile, name:f.owner_name}, theme:{color:'#FF2E7E'},
          handler: async (resp)=>{
            try{ const d=await api.post('/payments/subscription/verify',{
                   razorpay_payment_id:resp.razorpay_payment_id,
                   razorpay_subscription_id:resp.razorpay_subscription_id,
                   razorpay_signature:resp.razorpay_signature})
              setResult(d); setStep('linkqr'); setMsg('✅ Autopay set aayiduchu! QR sticker scan pannunga.') }
            catch(e){ setMsg('Verify failed: '+e.message) }
          }
        })
        rzp.on('payment.failed', ()=>setMsg('Payment failed. Marupadi try pannunga.'))
        rzp.open(); setMsg('UPI Autopay window open aaguthu... (innaiku ₹1 mattum)')
        return
      }
    }catch(e){ console.log('autopay unavailable, falling back:', e.message) }
    // Fallback: one-time Rs.299 (if autopay not available on gateway)
    const pay=await api.post('/payments/create',{shop_id:id,type:'registration'})
    if(pay.gateway==='razorpay' && window.Razorpay){
      const rzp=new window.Razorpay({
        key:pay.key_id, amount:pay.amount*100, currency:'INR',
        name:'NammaOor', description:'Shop Registration Rs.299',
        order_id:pay.order_id, prefill:{contact:f.mobile, name:f.owner_name},
        theme:{color:'#FF2E7E'},
        handler: async (resp)=>{
          try{ const d=await api.post('/payments/verify',{razorpay_order_id:resp.razorpay_order_id,
                 razorpay_payment_id:resp.razorpay_payment_id, razorpay_signature:resp.razorpay_signature})
            setResult(d); setStep('linkqr'); setMsg('Payment success! QR sticker scan pannunga.') }
          catch(e){ setMsg('Verify failed: '+e.message) }
        }
      })
      rzp.on('payment.failed', ()=>setMsg('Payment failed. Marupadi try pannunga.'))
      rzp.open(); setMsg('Payment window open aaguthu...')
    } else {
      const done=await api.post(`/payments/dev/mark-paid/${pay.txn_id}`)
      setResult(done); setStep('linkqr'); setMsg('Payment success (dev). QR sticker scan pannunga.')
    }
  }
  async function linkQr(){
    try{ const r=await api.post(`/shops/${shopId}/link-qr`,{token:token.trim(),emp_code:emp})
      setResult({...result,qr_token:r.qr_token,public_url:r.public_url}); setStep('done')
      localStorage.removeItem('draft_id'); localStorage.removeItem('reg_form'); localStorage.removeItem('reg_products') }
    catch(e){ setMsg('Error: '+e.message) }
  }
  async function genQr(){
    try{ setMsg('QR generate aaguthu...'); const r=await api.post(`/shops/${shopId}/generate-qr`)
      setResult({...result,qr_token:r.qr_token,public_url:r.public_url}); setStep('done')
      localStorage.removeItem('draft_id'); localStorage.removeItem('reg_form'); localStorage.removeItem('reg_products') }
    catch(e){ setMsg('Error: '+e.message) }
  }
  async function startScan(){
    if(!('BarcodeDetector' in window)){ setMsg('Camera scan illa - code-ai type pannunga'); return }
    try{
      setScanning(true)
      const det=new window.BarcodeDetector({formats:['qr_code']})
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
      const vd=videoRef.current; vd.srcObject=stream; await vd.play()
      const loop=async()=>{
        if(!vd.srcObject) return
        try{ const codes=await det.detect(vd)
          if(codes.length){ let val=codes[0].rawValue||''
            if(val.includes('/s/')) val=val.split('/s/')[1]
            setTok((val||'').replace(/\/$/,'').toUpperCase())
            stream.getTracks().forEach(t=>t.stop()); vd.srcObject=null; setScanning(false); return } }catch{}
        requestAnimationFrame(loop)
      }; loop()
    }catch(e){ setMsg('Camera error - type the code'); setScanning(false) }
  }

  const qrLink=result?qrImg(`${SITE}/#/s/${result.qr_token}`):''
  // Compose a printable sticker: shop name + QR + "Give your valuable reviews / Visit again" tag.
  const dlQr=async()=>{ try{
      const img=new Image(); img.crossOrigin='anonymous'
      await new Promise((res,rej)=>{img.onload=res; img.onerror=rej; img.src=qrLink})
      const W=620,H=820, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d')
      x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.textAlign='center'
      x.fillStyle='#FF2E7E'; x.fillRect(0,0,W,130)
      x.fillStyle='#fff'; x.font='bold 36px sans-serif'; x.fillText((f.shop_name||'Shop').slice(0,24),W/2,62)
      x.font='bold 24px sans-serif'; x.fillText('SCAN PANNUNGA!',W/2,100)
      const qs=400, qx=(W-qs)/2, qy=160; x.drawImage(img,qx,qy,qs,qs)
      // NammaOor logo in the QR centre (QR uses high error-correction, stays scannable)
      try{ const logo=new Image(); logo.crossOrigin='anonymous'
        await new Promise((res,rej)=>{logo.onload=res; logo.onerror=rej; logo.src='/logo.png'})
        const ls=96, cx=W/2, cy=qy+qs/2
        x.fillStyle='#fff'; x.fillRect(cx-ls/2-8, cy-ls/2-8, ls+16, ls+16)
        x.drawImage(logo, cx-ls/2, cy-ls/2, ls, ls)
      }catch(_){}
      // review / visit-again tag
      x.fillStyle='#FFF4E0'; x.strokeStyle='#FFC107'; x.lineWidth=3
      x.fillRect(35,590,W-70,150); x.strokeRect(35,590,W-70,150)
      x.fillStyle='#FF9800'; x.font='bold 30px sans-serif'; x.fillText('★ ★ ★ ★ ★',W/2,632)
      x.fillStyle='#8a5a00'; x.font='bold 28px sans-serif'; x.fillText('Review Your Ratings',W/2,675)
      x.font='bold 24px sans-serif'; x.fillText('Please Visit Again!',W/2,712)
      x.fillStyle='#7A2FF7'; x.fillRect(0,H-58,W,58)
      x.fillStyle='#fff'; x.font='bold 20px sans-serif'; x.fillText('NammaOor  •  '+(result.shop_code||''),W/2,H-20)
      const a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download=`NammaOor-QR-${result.shop_code||result.qr_token}.png`
      document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),1500)
    }catch(e){ window.open(qrLink,'_blank') } }
  const shareShopQr=async()=>{ const url=`${SITE}/#/s/${result.qr_token}`
    try{ const r=await fetch(qrLink); const blob=await r.blob(); const file=new File([blob],'shop-qr.png',{type:'image/png'})
      if(navigator.canShare&&navigator.canShare({files:[file]})) return navigator.share({files:[file],title:f.shop_name,text:`${f.shop_name} — NammaOor: ${url}`})
      if(navigator.share) return navigator.share({title:f.shop_name,text:url}) }catch(e){}
    try{ await navigator.clipboard.writeText(url); alert('Shop link copied!') }catch(_){ window.open(qrLink,'_blank') } }
  if(step==='done' && result) return (<>
    <Header/><div className="container"><div className="card" style={{textAlign:'center'}}>
      <span className="pill">✅ Registered</span>
      <h2 className="brand" style={{marginTop:10}}>{f.shop_name}</h2>
      <p style={{fontSize:20,fontWeight:800}}>{result.shop_code}</p>
      <p className="muted" style={{marginTop:2}}>Idho ungaloda kadai QR. Print eduthu kadaila oticikonga 👇</p>
      <div style={{background:'#fff',border:'1px solid var(--line)',borderRadius:16,padding:16,margin:'12px auto',display:'inline-block'}}>
        <div style={{position:'relative',width:230,height:230,maxWidth:'100%',margin:'0 auto'}}>
          <img src={qrLink} style={{width:'100%',height:'100%',display:'block'}}/>
          <img src="/logo.png" style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:48,height:48,borderRadius:8,background:'#fff',padding:4,boxShadow:'0 0 0 4px #fff'}}/>
        </div>
        <p style={{margin:'8px 0 0',fontWeight:700}}>Scan pannunga!</p>
        <div style={{marginTop:8,background:'#FFF4E0',border:'2px solid #FFC107',borderRadius:12,padding:'8px 10px'}}>
          <div style={{color:'#FF9800',fontSize:18,letterSpacing:3}}>★★★★★</div>
          <div style={{color:'#8a5a00',fontWeight:800,fontSize:15}}>Review Your Ratings</div>
          <div style={{color:'#8a5a00',fontWeight:700,fontSize:13}}>Please Visit Again! 🙏</div>
        </div>
        <p className="muted" style={{fontSize:12,marginTop:6}}>QR: {result.qr_token}</p>
      </div>
      <div className="grid2" style={{gap:8,marginTop:6}}>
        <button className="btn" onClick={dlQr}>⬇️ Download QR</button>
        <button className="btn ghost" onClick={shareShopQr}>📤 Share</button>
      </div>
      <a href={`#/s/${result.qr_token}`}><button className="btn tl" style={{marginTop:10,width:'100%'}}>👁 View Shop Page</button></a>
    </div></div></>)

  // ---- Entry chooser: Own shop vs Other shop ----
  if(mode==='choose') return (<>

    <div className="container" style={{maxWidth:460}}>
      <h2 className="brand">Kadai Pathivu / Shop Registration</h2>
      <div className="card" style={{textAlign:'center'}}>
        <p className="muted" style={{marginBottom:14}}>யாருடைய கடை பதிவு செய்யறீங்க?</p>
        <div style={{display:'grid',gap:12}}>
          <button className="btn" style={{padding:'18px',fontSize:16}}
            onClick={()=>{ setF(v=>({...v,own_shop:true,emp_code:''})); setMode('form') }}>
            🏪 என்னோட சொந்த கடை<br/><span style={{fontWeight:400,fontSize:12}}>Own Shop — நீங்களே பதிவு பண்ணுங்க</span>

      </div>
    </div></>)

  return (<>

    <div className="container">

      {step==='form' && <div className="card">
        {loadingCat && <div className="wakebanner">⏳ Server ready aaguthu (first open-la ~30-60 sec aagum)... District ippove select pannalaam. Category konjam neram-la varum.</div>}

/* ===== pages/Search.jsx ===== */
function StarsRow({v}){ return <span>{[1,2,3,4,5].map(n=><span key={n} style={{color:n<=Math.round(v)?'#FFB800':'#ddd'}}>*</span>)}</span> }
const _ext=u=>{ u=(u||'').trim(); return u?(/^https?:\/\//i.test(u)?u:'https://'+u.replace(/^\/+/,'')):'' }
// Contact icons shown on each search result. stopPropagation so tapping an icon
// opens the contact (not the shop page).
function ShopIcons({s}){
  const stop=e=>e.stopPropagation()
  const items=[]
  if(s.mobile)    items.push(['#16a34a','📞',`tel:${s.mobile}`,false])
  if(s.whatsapp)  items.push(['#25D366','💬',`https://wa.me/91${s.whatsapp}`,true])
  if(s.instagram) items.push(['#E1306C','📷',_ext(s.instagram),true])
  if(s.facebook)  items.push(['#1877F2','f',_ext(s.facebook),true])
  if(!items.length) return null
  return <div className="sicons" onClick={stop}>
    {items.map(([c,ic,href,blank],i)=>(
      <a key={i} href={href} onClick={stop} {...(blank?{target:'_blank',rel:'noopener noreferrer'}:{})}
         className="sic" style={{background:c}}>{ic}</a>))}
  </div>
}
function Search(){
  const nav=useNavigate()
  const [districts,setD]=useState([]); const [assemblies,setA]=useState([]); const [cats,setC]=useState([])
  const [q,setQ]=useState({text:'',district:'',assembly:'',town:'',category:''}); const [res,setRes]=useState([]); const [done,setDone]=useState(false)
  useEffect(()=>{ api.get('/geo/districts').then(setD).catch(()=>{}); api.get('/geo/categories').then(setC).catch(()=>{}) },[])
  useEffect(()=>{ if(q.district) api.get('/geo/assemblies?district_id='+q.district).then(setA).catch(()=>{}) },[q.district])
  async function search(){
    const p=new URLSearchParams()
    if(q.text)p.set('q',q.text); if(q.district)p.set('district',q.district); if(q.assembly)p.set('assembly',q.assembly)
    if(q.town)p.set('town',q.town); if(q.category)p.set('category',q.category)
    setRes(await api.get('/search?'+p.toString()).catch(()=>[])); setDone(true)
  }
  const [near,setNear]=useState(false); const [geoMsg,setGeoMsg]=useState('')
  function nearMe(){
    if(!navigator.geolocation){ setGeoMsg('Location support illa'); return }
    setGeoMsg('📍 Location edukkiraen...')
    navigator.geolocation.getCurrentPosition(async pos=>{
      const p=new URLSearchParams({lat:pos.coords.latitude,lng:pos.coords.longitude,radius_km:'30'})
      if(q.text)p.set('q',q.text); if(q.category)p.set('category',q.category)
      try{ const r=await api.get('/search/near?'+p.toString()); setRes(r); setNear(true); setDone(true)
        setGeoMsg(r.length?'':'Pakkathula (30km) kadai illa.') }
      catch(e){ setGeoMsg('Search fail: '+e.message) }
    }, err=>setGeoMsg('Location deny aachu. Phone settings-la location allow pannunga.'),
       {enableHighAccuracy:false,timeout:15000,maximumAge:60000})
  }
  const set=k=>e=>setQ({...q,[k]:e.target.value})
  return (<><Header/><div className="container">
    <h2 className="brand">Kadaigalai Thedu / Find Shops</h2>
    <div className="card">
      <input className="input" style={{fontSize:16}} placeholder="Search shop name, product, area..." value={q.text}
        onChange={set('text')} onKeyDown={e=>e.key==='Enter'&&search()}/>
      <div className="grid2">
        <select onChange={set('district')}><option value="">District</option>{districts.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select>
        <select onChange={set('assembly')}><option value="">Assembly</option>{assemblies.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select>
        <input className="input" placeholder="Town / Village" onChange={set('town')}/>
        <select onChange={set('category')}><option value="">Category</option>{cats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
      </div>
      <div className="row"><button className="btn" onClick={()=>{setNear(false);search()}}>🔍 Search</button><button className="btn ghost" onClick={nearMe}>📍 Near me</button></div>
      {geoMsg&&<p className="muted" style={{marginTop:6}}>{geoMsg}</p>}
    </div>
    {res.map(s=>(
      <div key={s.shop_code} className="card scard">
        <div className="scard-main" onClick={()=>nav(`/shop/${(s.shop_code||'').replace('-','')}`)}>
          <div style={{width:48,height:48,borderRadius:12,background:'#f4f0ff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,overflow:'hidden',flex:'0 0 auto'}}>
            {s.logo_url?<img src={s.logo_url} onError={onImgErr} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:catIcon(s.category,s.category)}</div>
          <div style={{flex:1,minWidth:0}}><b>{s.shop_name}</b>
            <div className="muted">{s.category||''} {s.town?('- '+s.town):''}{s.distance_km!=null?(' · 📍 '+s.distance_km+' km'):''}</div>
            {s.reviews>0 && <div style={{fontSize:13}}><StarsRow v={s.rating}/> {s.rating} ({s.reviews})</div>}
            {s.bio && <div className="muted" style={{fontSize:12}}>{s.bio}</div>}
          </div>
        </div>
        <ShopIcons s={s}/>
      </div>))}
    {done && res.length===0 && <p className="muted">No shops found. Try a different search.</p>}
    {!done && <p className="muted">Search by name, category, or area.</p>}
  </div></>)
}


/* ===== pages/Products.jsx ===== */

const PCATS=['All','Clothing','Footwear','Grocery','Electronics','Jewellery','Home & Kitchen',
  'Beauty & Care','Food & Bakery','Mobile & Accessories']


function CStars({v}){const f=Math.round(v||0);return <span className="stars sm">{[1,2,3,4,5].map(i=><span key={i} className={i<=f?'on':''}>★</span>)}</span>}

function Card({r}){
  const price=r.offer_price||r.price
  const off=r.offer_price&&r.price?Math.round((1-r.offer_price/r.price)*100):0
  return (
    <a href={'#/p/'+r.id} className="pcard">
      <div className="pcimg-wrap">
        <img className="pcimg" loading="lazy" src={r.thumbnail||PLACEHOLDER} onError={onImgErr} alt={r.title||r.name}/>
        {off>0 && <span className="off-tag">{off}% OFF</span>}
        {r.in_stock===false && <span className="oos-tag">Out of stock</span>}
      </div>
      <div className="pcbody">
        {r.brand && <span className="pc-brand">{r.brand}</span>}
        <b className="pctitle">{r.title||r.name}</b>
        {(r.rating>0) && <span className="pc-rate"><CStars v={r.rating}/><span className="muted">({r.review_count||0})</span></span>}
        <span className="pcprice">₹{price||'—'}{off>0 && <s className="muted">₹{r.price}</s>}</span>
        {r.short_desc && <span className="pc-desc">{r.short_desc}</span>}
        <span className="pc-shop">🏪 {r.shop_name}{r.town?` · ${r.town}`:''}</span>
      </div>
    </a>
  )
}

function Products(){
  const [q,setQ]=useState(''); const [cat,setCat]=useState('All')
  const [rows,setRows]=useState([]); const [busy,setBusy]=useState(true)
  const load=()=>{ setBusy(true)
    const p=new URLSearchParams(); if(q)p.set('q',q); if(cat&&cat!=='All')p.set('category',cat)
    api.get('/products/search'+(p.toString()?'?'+p:'')).then(r=>{setRows(r);setBusy(false)}).catch(()=>setBusy(false)) }
  useEffect(load,[])
  return (<><Header/><div className="container">
    <h2 className="brand">Shop Products</h2>
    <div className="row psearchbar" style={{gap:8}}>
      <input className="input" style={{flex:2}} placeholder="Search products, brands..." value={q}
        onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&load()}/>
      <select className="input" value={cat} onChange={e=>{setCat(e.target.value)}}>{PCATS.map(c=><option key={c}>{c}</option>)}</select>
      <button className="btn" onClick={load}>Search</button>
    </div>
    {busy
      ? <div className="pgrid">{[1,2,3,4,5,6,7,8].map(i=><div key={i} className="pcard"><div className="pcimg-wrap sk"/><div className="pcbody"><div className="skln"/><div className="skln sm"/><div className="skln sm"/></div></div>)}</div>
      : rows.length===0
        ? <div className="empty"><div style={{fontSize:44}}>🛍️</div><p className="muted">No products found. Try another search.</p></div>
        : <div className="pgrid">{rows.map(r=><Card key={r.id} r={r}/>)}</div>}
  </div></>)
}

// ---- UPI helpers (NPCI-compliant deep link) ----
function isValidVpa(v){ return !!v && /^[\w.\-]{2,256}@[a-zA-Z]{2,64}$/.test(v.trim()) }
function buildUpiUri(vpa, name, amount, note){
  const pa=(vpa||'').trim()
  if(!isValidVpa(pa)) return null
  // Build params with URLSearchParams (encodes each value), then fix UPI quirks:
  //  - spaces must be %20 (not '+'), so GPay/PhonePe parse the note/name correctly
  //  - the VPA (pa) '@' must stay literal, so it is prepended raw (not via URLSearchParams)
  const params=new URLSearchParams()
  params.set('pn',(name||'Shop').trim())
  const amt=Number(amount)
  if(amt>0) params.set('am', String(amt))          // am=1 (no forced decimals)
  params.set('cu','INR')
  params.set('tn',(note||('Payment to '+(name||'Shop').trim())).slice(0,50))
  const qs=params.toString().replace(/\+/g,'%20')  // UPI needs %20 for spaces, not '+'
  return `upi://pay?pa=${pa}&${qs}`
}
function launchUpi(uri, app){
  // app-specific schemes work far better than generic upi:// (esp. GPay)
  let target=uri
  if(app==='gpay')    target=uri.replace(/^upi:\/\//,'tez://upi/')
  if(app==='phonepe') target=uri.replace(/^upi:\/\//,'phonepe://')
  if(app==='paytm')   target=uri.replace(/^upi:\/\//,'paytmmp://')
  try{ window.location.assign(target) }
  catch(e){ try{ window.location.href=target }catch(_){}}
}

}

const LABEL={received:'Order Received',payment_received:'Payment Received',preparing:'Preparing',
  packed:'Packed',shipped:'Shipped',delivered:'Delivered'}

function OrderTrack(){
  const token=(location.hash.split('/order/')[1]||'').split('?')[0]
  const [o,setO]=useState(null)
  useEffect(()=>{ api.get('/order/'+token).then(setO).catch(()=>setO({found:false})) },[])
  if(!o) return <><Header/><div className="container"><div className="card">Loading…</div></div></>
  if(!o.found) return <><Header/><div className="container"><div className="card">Order not found.</div></div></>
  const flow=o.flow||['received','payment_received','preparing','packed','shipped','delivered']
  const idx=flow.indexOf(o.status)
  return (<><Header/><div className="container">
    <h2 className="brand">Order {o.order_no}</h2>
    <div className="card">
      <p><b>{o.product_name}</b> × {o.qty} · Rs.{o.amount}</p>
      <p className="muted">Shop: {o.shop_name}</p>
      {o.status==='cancelled'? <div className="dot hidden" style={{fontSize:16}}>Cancelled</div>
      : <div className="track">{flow.map((s,i)=><div key={s} className={'tstep'+(i<=idx?' done':'')}>
          <div className="tdot">{i<=idx?'✓':i+1}</div><span>{LABEL[s]||s}</span></div>)}</div>}
    </div>
  </div></>)
}

const CK_SHOW_PAY = false;  // payment QR — later enable pannalam
function ckGet(){ try{return JSON.parse(localStorage.getItem('cart')||'[]')}catch{return[]} }
function ckSet(c){ localStorage.setItem('cart', JSON.stringify(c)) }
function ckVpa(v){ return /^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test((v||'').trim()) }
function ckUpi(vpa,name,amt){
  const p=new URLSearchParams(); p.set('pn',(name||'Shop').trim()); p.set('cu','INR')
  if(amt&&+amt>0) p.set('am', String(Math.round(+amt)))
  p.set('tn','NammaOor order')
  return `upi://pay?pa=${(vpa||'').trim()}&`+p.toString().replace(/\+/g,'%20')
}

// ---------- helpers ----------
const R=(n)=>Math.round((+n||0)*100)/100
const money=(n)=>'₹'+R(n).toFixed(2)
function calcRow(r){ const q=+r.qty||0, p=+r.price||0, d=+r.discount||0, g=+r.gst||0
  const base=q*p-d; const gstAmt=base*g/100; return {base:R(base), gst:R(gstAmt), total:R(base+gstAmt)} }
function calcAll(rows, delivery){
  let sub=0, disc=0, gst=0
  rows.forEach(r=>{ const c=calcRow(r); sub+=(+r.qty||0)*(+r.price||0); disc+=(+r.discount||0); gst+=c.gst })
  const before=sub-disc+gst+(+delivery||0)
  const grand=Math.round(before); const roundOff=R(grand-before)
  return {subtotal:R(sub), discount:R(disc), gst_amount:R(gst), delivery:R(+delivery||0), round_off:roundOff, grand_total:R(grand)}
}

function Billing(){
  const [shop,setShop]=useState(null)
  const [view,setView]=useState('dash')            // dash | new | history | print
  const [stats,setStats]=useState({})
  const [list,setList]=useState([]); const [qy,setQy]=useState(''); const [period,setPeriod]=useState('')
  const [msg,setMsg]=useState('')
  const emptyRow={name:'',qty:1,price:'',discount:0,gst:0}
  const [cust,setCust]=useState({customer_name:'',customer_mobile:'',customer_whatsapp:'',customer_address:'',customer_email:''})
  const [rows,setRows]=useState([{...emptyRow}])
  const [meta,setMeta]=useState({payment_method:'cash',payment_status:'paid',sales_person:'',delivery:0,notes:''})
  const [saved,setSaved]=useState(null)            // saved invoice for print view
  const [custInfo,setCustInfo]=useState(null)

  const load=()=>{ api.get('/me/shop').then(setShop).catch(e=>setMsg(e.message))
    api.get('/me/shop/billing/stats').then(setStats).catch(()=>{}) }
  useEffect(load,[])
  const loadHistory=(p,qq)=>{ const u=new URLSearchParams(); if(qq)u.set('q',qq); if(p)u.set('period',p)
    api.get('/me/shop/invoices?'+u.toString()).then(setList).catch(()=>{}) }
  useEffect(()=>{ if(view==='history') loadHistory(period,qy) },[view,period])

  // customer auto-load on mobile entry
  const onMobile=async(v)=>{ setCust(c=>({...c,customer_mobile:v}))
    const d=v.replace(/\D/g,''); if(d.length>=10){
      try{ const r=await api.get('/me/shop/invoices/customer?mobile='+d)
        if(r.found){ setCust(c=>({...c,customer_name:r.customer_name||c.customer_name,
          customer_whatsapp:r.customer_whatsapp||c.customer_whatsapp,
          customer_address:r.customer_address||c.customer_address,
          customer_email:r.customer_email||c.customer_email}))
          setCustInfo(r); setMsg('✅ Pazhaya customer! Details auto-fill aachu.') }
        else setCustInfo(null) }catch(e){} } }

  const upd=(i,k,v)=>setRows(rs=>rs.map((r,ix)=>ix===i?{...r,[k]:v}:r))
  const addRow=()=>setRows(rs=>[...rs,{...emptyRow}])
  const delRow=(i)=>setRows(rs=>rs.filter((_,ix)=>ix!==i))

          <div className="row" style={{justifyContent:'space-between',fontSize:19,marginTop:4,color:'var(--magenta)'}}><b>Grand Total</b><b>{money(totals.grand_total)}</b></div>

/* ===== pages/TvDisplay.jsx ===== */

// Fullscreen digital-signage player. TV opens nammaoor.shop/#/tv
// -> shows 6-digit pair code -> owner pairs from dashboard -> slideshow.

const THEMES={
  dark:    {bg:'#0e0b1a', ink:'#fff',     sub:'#b9b3d0', card:'#1d1733', dark:true},
  light:   {bg:'#f7f4fb', ink:'#141225',  sub:'#5a5578', card:'#fff',    dark:false},
  minimal: {bg:'#ffffff', ink:'#111111',  sub:'#777777', card:'#f4f4f4', dark:false},
  luxury:  {bg:'linear-gradient(135deg,#0b0b0b,#221a06,#0b0b0b)', ink:'#f5e6b8', sub:'#c9b36a', card:'#171307', dark:true},
  festival:{bg:'linear-gradient(-45deg,#FF6A00,#FF2E7E,#7A2FF7,#00C2A8)', ink:'#fff', sub:'#ffe9f4', card:'rgba(0,0,0,.28)', dark:true, animBg:true},
}
const TRANS={fade:'tvslide', slide:'tvslideL', slideup:'tvup', zoom:'tvzoom', zoomout:'tvzo',
  flip:'tvflip', rotate:'tvrot', bounce:'tvbounce', blur:'tvblur', pop:'tvpop', swing:'tvswing'}
const LOOPFX={float:'tvfx-float', pulse:'tvfx-pulse', blink:'tvfx-blink'}

// Isolated clock: its own 1-second timer so the MAIN player never re-renders
// per second (that caused visible flicker/re-animation of slides).
function TvClock({ink,dark}){
  const [t,setT]=useState(new Date())
  useEffect(()=>{ const i=setInterval(()=>setT(new Date()),1000); return ()=>clearInterval(i) },[])
  return <div style={{position:'fixed',top:'2.2vh',left:'2.6vw',zIndex:60,
    fontSize:'3vh',fontWeight:800,color:ink,background:dark?'rgba(0,0,0,.35)':'rgba(255,255,255,.6)',
    padding:'.6vh 1.4vw',borderRadius:12,fontVariantNumeric:'tabular-nums'}}>
    {t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
}

function TvDisplay(){
  const [code,setCode]=useState(()=>{ try{return localStorage.getItem('nm_tv_code')||''}catch(e){return ''} })
  const [st,setSt]=useState(null)      // server state
  const [idx,setIdx]=useState(0)       // flattened slide index
  const [anim,setAnim]=useState(true)
  const [hr,setHr]=useState(new Date().getHours())   // hour only (schedule filter)
  const [fs,setFs]=useState(false)
  const timer=useRef(null)
  useEffect(()=>{ const h=()=>setFs(!!document.fullscreenElement)
    document.addEventListener('fullscreenchange',h); return ()=>document.removeEventListener('fullscreenchange',h) },[])
  const goFs=()=>{ try{ const el=document.documentElement
    ;(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el) }catch(e){} }

  // get / create pair code
  useEffect(()=>{ if(!code){
    api.post('/tv/new',{}).then(r=>{ setCode(r.pair_code); try{localStorage.setItem('nm_tv_code',r.pair_code)}catch(e){} }).catch(()=>{})
  }},[])
  // hour tick (once a minute is enough for slide scheduling)
  useEffect(()=>{ const i=setInterval(()=>setHr(new Date().getHours()),60000); return ()=>clearInterval(i) },[])
  // poll state: 5s until paired, 30s after
  useEffect(()=>{ if(!code) return
    let stop=false
    const tick=async()=>{ try{ const r=await api.get('/tv/state/'+code)
        if(!stop){ if(r.found===false){ try{localStorage.removeItem('nm_tv_code')}catch(e){}; setCode('') } else setSt(r) } }catch(e){}
      if(!stop) setTimeout(tick, (st&&st.paired)?30000:5000) }
    tick(); return ()=>{stop=true}
  },[code, st&&st.paired])

  const settings=(st&&st.settings)||{}
  const th=THEMES[settings.theme]||THEMES.dark
  const dark=th.dark
  const animCls=anim?(TRANS[settings.transition]||'tvslide'):''

  // ---------- AUDIO ENGINE (owner-uploaded music + voice announcements) ----------
  const audRef=useRef(null), annRef=useRef(null), fadeTimer=useRef(null), advRef=useRef(0)
  const [needTap,setNeedTap]=useState(false)
  const [songIx,setSongIx]=useState(0)
  const annc=settings.announce
  // playlist: full songs play one-after-another, independent of slide changes
  const playlist=(settings.playlist&&settings.playlist.length)?settings.playlist
    :((settings.audio&&settings.audio.url)?[settings.audio]:[])
  const curSong=playlist.length?playlist[songIx%playlist.length]:null
  const aVol=(settings.audio_vol==null?70:settings.audio_vol)/100
  const doFade=settings.audio_fade!==false
  const wantAudio=!!(st&&st.paired&&st.playing&&curSong&&curSong.url&&!settings.audio_mute)
  const fadeTo=(el,target,ms)=>{ if(!el)return; clearInterval(fadeTimer.current)
    if(!doFade||ms<=0){ el.volume=Math.max(0,Math.min(1,target)); if(target===0)el.pause(); return }
    const step=(target-el.volume)/(ms/100)
    fadeTimer.current=setInterval(()=>{ let v=el.volume+step
      if((step>0&&v>=target)||(step<0&&v<=target)){ v=target; clearInterval(fadeTimer.current); if(target===0)el.pause() }
      el.volume=Math.max(0,Math.min(1,v)) },100) }
  const unlock=()=>{ const a=audRef.current
    if(a){ a.play().then(()=>{ setNeedTap(false); fadeTo(a,aVol,doFade?2000:0) }).catch(()=>{}) }
    if(annRef.current){ annRef.current.play().then(()=>{ annRef.current.pause(); annRef.current.currentTime=0 }).catch(()=>{}) } }
  useEffect(()=>{
    if(!wantAudio){ if(audRef.current) fadeTo(audRef.current,0,doFade?1500:0); return }
    let a=audRef.current
    if(!a||a._url!==curSong.url){ if(a)a.pause(); a=new Audio(curSong.url); a._url=curSong.url; audRef.current=a }
    // single song: loop that song; playlist: advance to next full song when this one ENDS
    a.loop=(playlist.length===1)&&settings.audio_loop!==false
    a.onended=()=>{ if(playlist.length>1){
      if(songIx+1<playlist.length||settings.audio_loop!==false) setSongIx(i=>(i+1)%playlist.length) } }
    if(a.paused){ a.volume=doFade?0:aVol
      a.play().then(()=>{ setNeedTap(false); fadeTo(a,aVol,doFade?2500:0) }).catch(()=>setNeedTap(true)) }
    else fadeTo(a,aVol,600)
  },[wantAudio, curSong&&curSong.url, aVol, settings.audio_loop, settings.audio_fade, playlist.length])
  useEffect(()=>()=>{ if(audRef.current)audRef.current.pause(); if(annRef.current)annRef.current.pause()
    clearInterval(fadeTimer.current) },[])
  // voice announcement: every N slide-changes, duck music -> play voice -> restore
  useEffect(()=>{ if(!st||!st.paired||!st.playing) return
    advRef.current++
    const every=settings.announce_every||5
    if(!annc||!annc.url||advRef.current%every!==0) return
    let v=annRef.current
    if(!v||v._url!==annc.url){ v=new Audio(annc.url); v._url=annc.url; annRef.current=v }
    const a=audRef.current
    if(a&&!a.paused){ clearInterval(fadeTimer.current); a.volume=Math.max(0,aVol*0.15) }
    v.volume=1; v.currentTime=0
    v.onended=()=>{ if(a&&!a.paused) fadeTo(a,aVol,800) }
    v.play().catch(()=>{})
  },[idx])
  // TV remote OK / any key / click unlocks sound (browser autoplay rule)
  useEffect(()=>{ if(!needTap) return
    const h=()=>unlock()
    window.addEventListener('keydown',h); window.addEventListener('click',h)
    return ()=>{ window.removeEventListener('keydown',h); window.removeEventListener('click',h) }
  },[needTap, music&&music.url, aVol])

  // schedule filter: slide visible only in its hour window (empty = always)
  const inTime=(sl)=>{ const f=sl.from, t=sl.to
    if(f==null||t==null||f===''||t==='') return true
    const a=+f, b=+t; return a<=b ? (hr>=a&&hr<b) : (hr>=a||hr<b) }

  // build flattened slide list (products expand into one slide per product)
  const flat=[]
  if(st&&st.paired){
    for(const sl of (st.slides||[])){
      if(!inTime(sl)) continue
      if(sl.type==='products'){ (st.products||[]).forEach(p=>flat.push({...sl,type:'product',p})) }
      else flat.push(sl)
    }
  }
  const dur=((settings.duration)||8)*1000
  useEffect(()=>{ if(!st||!st.paired||!st.playing||flat.length===0) return
    clearTimeout(timer.current)
    timer.current=setTimeout(()=>{ setAnim(false); setTimeout(()=>{ setIdx(i=>(i+1)%flat.length); setAnim(true) },60) }, dur)
    return ()=>clearTimeout(timer.current)
  },[idx, st, flat.length])

  const bg=th.bg, ink=th.ink, sub=th.sub

  const hasTicker=!!(settings.ticker&&String(settings.ticker).trim())

  // Plain JSX (NOT a component) so the slide tree never remounts on re-render.
  const overlay=(<>
    <img src="/logo.png" style={{position:'fixed',top:'2vh',right:'2.4vw',height:'5.5vh',zIndex:60,

      transform:'translateX(-50%)',zIndex:80,background:'#fff',color:'#141225',borderRadius:16,
