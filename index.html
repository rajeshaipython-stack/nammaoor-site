  </>)

  // Plain function (lowercase) — returns JSX in place, keeps DOM stable across renders.
  const loopFx=LOOPFX[settings.loop_fx]||''
  const wrap=(children)=>(
    <div className={th.animBg?'tvbganim':''} style={{position:'fixed',inset:0,background:bg,color:ink,display:'flex',flexDirection:'column',

    if(tpl==='gallery') return wrap(
      <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
        <div style={{fontSize:'2vh',letterSpacing:6,textTransform:'uppercase',color:sub}}>— Our Collection —</div>

    // 🖼️ CLASSIC (default)
    return wrap(
    <div style={{display:'flex',alignItems:'center',gap:'4vw',flexWrap:'wrap',justifyContent:'center'}}>
      <div style={{width:'34vh',height:'34vh',borderRadius:24,background:th.card,display:'flex',

        <div style={{fontSize:'2.2vh',color:sub,textTransform:'uppercase',letterSpacing:2}}>{p.category||'Product'}</div>
        <div style={{fontSize:'5.5vh',fontWeight:900,lineHeight:1.15}}>{p.name}</div>
        {priceRow(true)}{stock}
      </div>
    </div>)
  }

  if(s.type==='qr_pay') return wrap(<>
    <div style={{fontSize:'5.5vh',fontWeight:900,...gradText}}>💳 Scan & Pay</div>
    <div style={{background:'#fff',padding:'2.4vh',borderRadius:24,boxShadow:'0 14px 44px rgba(0,0,0,.3)'}}>
      <img src={qrImg(upiUri||shopUrl)} style={{width:'34vh',height:'34vh'}}/>
    </div>
    <div style={{fontSize:'3vh',fontWeight:700}}>{upiUri?'GPay · PhonePe · Paytm — edhu venaalum':'Scan pannunga'}</div>
    {shop.upi_id&&<div style={{fontSize:'2.2vh',color:sub}}>{shop.upi_id}</div>}
  </>)

  if(s.type==='review') return wrap(<>
    <div style={{fontSize:'6vh'}}>⭐⭐⭐⭐⭐</div>
    <div style={{fontSize:'5vh',fontWeight:900}}>Love our service?</div>
    <div style={{fontSize:'3vh',color:sub}}>Scan QR to review us — ungaloda rating engalukku mukkiyam! 🙏</div>
    <div style={{background:'#fff',padding:'2vh',borderRadius:20,boxShadow:'0 14px 44px rgba(0,0,0,.3)'}}>
      <img src={qrImg(reviewUrl)} style={{width:'28vh',height:'28vh'}}/>
    </div>
  </>)

  if(s.type==='info') return wrap(<>
    {shop.logo_url&&<img src={shop.logo_url} style={{height:'12vh',borderRadius:16}}/>}
    <div style={{fontSize:'5.5vh',fontWeight:900,...gradText}}>{shop.shop_name}</div>
    <div style={{fontSize:'2.8vh',color:sub,display:'flex',flexDirection:'column',gap:'1vh'}}>
      {shop.owner_name&&<span>👤 {shop.owner_name}</span>}
      {shop.address&&<span>📍 {shop.address}</span>}
      <span>📞 {shop.mobile}</span>
      {(shop.open_time||shop.close_time)&&<span>🕐 {shop.open_time||''} – {shop.close_time||''}</span>}
      {shop.bio&&<span style={{fontSize:'2.4vh'}}>{shop.bio}</span>}
    </div>
  </>)

  if(s.type==='image'&&s.image) return (
    <div style={{position:'fixed',inset:0,background:'#000',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <img src={s.image} className={animCls} style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain'}}/>
      {overlay}
    </div>)

  if(s.type==='video'&&s.video) return (
    <div style={{position:'fixed',inset:0,background:'#000',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <video key={s.id||s.video} src={s.video} autoPlay muted loop playsInline
        style={{maxWidth:'100%',maxHeight:'100%'}}/>
      {overlay}
    </div>)

  // custom text slide fallback
  return wrap(<>
    <div style={{fontSize:'6vh',fontWeight:900,...gradText}}>{s.title||''}</div>
    {s.text&&<div style={{fontSize:'3.2vh',color:sub,whiteSpace:'pre-wrap'}}>{s.text}</div>}
  </>)
}

  info:['🏪','Shop Information'], image:['🖼️','Poster / Ad Image'],

}
const THEME_OPTS=[['dark','🌙 Dark (premium)'],['light','☀️ Light'],['minimal','⬜ Minimal (clean white)'],
  ['luxury','👑 Luxury (gold & black)'],['festival','🎉 Festival (colorful moving)']]
const TRANS_OPTS=[['fade','✨ Fade Up'],['slide','➡️ Slide In'],['slideup','⬆️ Rise Up'],
  ['zoom','🔍 Zoom In'],['zoomout','🔎 Zoom Out'],['flip','🔃 Flip 3D'],['rotate','🌀 Rotate In'],
  ['bounce','🏀 Bounce'],['blur','💨 Blur Focus'],['pop','🎈 Pop'],['swing','🎐 Swing']]
const LOOP_OPTS=[['none','Illa (stable)'],['float','🪁 Float — methuva midhakkum'],
  ['pulse','💓 Pulse — thudikkum'],['blink','✨ Blink — minnum']]
const TRANS_CLS={fade:'tvslide',slide:'tvslideL',slideup:'tvup',zoom:'tvzoom',zoomout:'tvzo',
  flip:'tvflip',rotate:'tvrot',bounce:'tvbounce',blur:'tvblur',pop:'tvpop',swing:'tvswing'}
const LOOP_CLS={float:'tvfx-float',pulse:'tvfx-pulse',blink:'tvfx-blink'}
const TEMPLATES=[
  ['classic','🖼️','Classic','Photo pakkathula details',{}],
  ['popcard','🃏','Pop Card','Color card mela product pop aagum',{theme:'light',transition:'pop',loop_fx:'float'}],
  ['bigtext','🅰️','Big Text','Product name perusa back-la style-a',{theme:'dark',transition:'slide',loop_fx:'pulse'}],
  ['gallery','🏛️','Gallery','Clean premium look (jewellery/boutique)',{theme:'minimal',transition:'fade',loop_fx:'none'}]]
const PV_THEMES={
  dark:{bg:'#0e0b1a',ink:'#fff',sub:'#b9b3d0'}, light:{bg:'#f7f4fb',ink:'#141225',sub:'#5a5578'},
  minimal:{bg:'#fff',ink:'#111',sub:'#777'},
  luxury:{bg:'linear-gradient(135deg,#0b0b0b,#221a06,#0b0b0b)',ink:'#f5e6b8',sub:'#c9b36a'},
  festival:{bg:'linear-gradient(-45deg,#FF6A00,#FF2E7E,#7A2FF7,#00C2A8)',ink:'#fff',sub:'#ffe9f4',animBg:true}}

const AUDIO_CONSENT="I confirm that I own this audio or have the necessary permission to use it. I understand that I am solely responsible for the content I upload.\n\n(Intha audio enakku sontham / permission irukku. Naan upload panra content-ku naan mattum thaan responsible-nu oppukkuren.)\n\nOK = Accept & Upload"
const pickAudio=()=>new Promise(res=>{
  const i=document.createElement('input'); i.type='file'
  i.accept='.mp3,.wav,.aac,.m4a,.ogg,audio/*'
  i.onchange=()=>{ const f=i.files&&i.files[0]; if(!f)return res(null)
    if(!/audio\//.test(f.type)&&!/\.(mp3|wav|aac|m4a|ogg)$/i.test(f.name)){ alert('Audio file mattum (MP3/WAV/AAC/M4A/OGG)'); return res(null) }
    if(f.size>12*1024*1024){ alert('Max 12 MB. Periya file-a chinna panni (MP3 128kbps) upload pannunga.'); return res(null) }
    const r=new FileReader(); r.onload=()=>res({data:r.result,name:f.name}); r.readAsDataURL(f) }
  i.click() })

function TvManage(){

  const [ticker,setTicker]=useState(''); const [tickerInit,setTickerInit]=useState(false)

    if(!tickerInit&&r&&r.settings){ setTicker(r.settings.ticker||''); setTickerInit(true) } }).catch(e=>setMsg(e.message))
  useEffect(()=>{ load(); const t=setInterval(load,30000); return ()=>clearInterval(t) },[])

      setTv({...r,paired:true}); if(note)setMsg(note) }catch(e){ setMsg('❌ '+e.message) } }
  const slides=(tv&&tv.slides)||[]
  const setSlides=(sl,note)=>save({slides:sl},note||'✅ Saved — TV auto-update aagum')
  const move=(i,d)=>{ const sl=[...slides]; const j=i+d; if(j<0||j>=sl.length)return
    ;[sl[i],sl[j]]=[sl[j],sl[i]]; setSlides(sl) }
  const toggleHide=(i)=>{ const sl=slides.map((s,ix)=>ix===i?{...s,hidden:!s.hidden}:s); setSlides(sl) }
  const del=(i)=>{ if(!confirm('Slide delete pannalaama?'))return; setSlides(slides.filter((_,ix)=>ix!==i)) }
  const dup=(i)=>{ const sl=[...slides]; sl.splice(i+1,0,{...slides[i],id:Date.now()}); setSlides(sl) }
  const sched=(i)=>{ const cur=slides[i]
    const v=prompt('Intha slide entha time kaattanum? (24hr, e.g. 9-18 = kaalai 9 to maalai 6).\nEmpty = full time.',
      (cur.from!=null&&cur.from!=='')?(cur.from+'-'+cur.to):'')
    if(v===null)return
    if(!v.trim()){ setSlides(slides.map((s,ix)=>ix===i?{...s,from:null,to:null}:s),'✅ Full time show aagum'); return }
    const m=v.trim().match(/^(\d{1,2})\s*-\s*(\d{1,2})$/)

    setSlides(slides.map((s,ix)=>ix===i?{...s,from:+m[1],to:+m[2]}:s),'⏰ Time set: '+m[1]+':00 - '+m[2]+':00') }
  const addSlide=async()=>{

      s.video=u }
    setSlides([...slides,s],'✅ Slide add aayiduchu'); setNt({type:'text',title:'',text:'',video:''}) }
  const settings=(tv&&tv.settings)||{duration:8,theme:'dark'}
  const hiddenCt=slides.filter(s=>s.hidden).length
  // live preview replay
  const [pvKey,setPvKey]=useState(0)
  useEffect(()=>{ const i=setInterval(()=>setPvKey(k=>k+1),4000); return ()=>clearInterval(i) },[])
  const pvTh=PV_THEMES[settings.theme]||PV_THEMES.dark
  const pvAnim=TRANS_CLS[settings.transition]||'tvslide'
  const pvLoop=LOOP_CLS[settings.loop_fx]||''
  const [busy,setBusy]=useState('')
  const uploadAudio=async(kind)=>{
    if(!confirm(AUDIO_CONSENT)) return
    const f=await pickAudio(); if(!f) return
    setBusy(kind); setMsg('⏳ Uploading audio…')
    try{ const r=await api.post('/me/shop/tv/audio',{data_url:f.data,kind,name:f.name})
      setTv({...r,paired:true}); setMsg('✅ Audio upload aayiduchu — TV-la play aagum') }
    catch(e){ setMsg('❌ '+e.message) }
    setBusy('') }
  const delAudio=async(kind,index)=>{ if(!confirm('Remove pannalaama?'))return
    try{ const r=await api.del('/me/shop/tv/audio?kind='+kind+(index!=null?('&index='+index):''))
      setTv({...r,paired:true}); setMsg('🗑 Removed') }
    catch(e){ setMsg('❌ '+e.message) } }
  const playlistM=(settings.playlist&&settings.playlist.length)?settings.playlist
    :(settings.audio?[settings.audio]:[])
  const announce=settings.announce

  return (<><Header/><div className="container" style={{maxWidth:760}}>

          <div className="row" style={{gap:6}}>
            {tv.playing
              ? <button className="btn sm" style={{background:'#c0392b'}} onClick={()=>save({playing:false},'⏸ Paused')}>⏸ Stop</button>

          </div>
        </div>
        <p className="muted" style={{fontSize:12,marginTop:8}}>

        <div className="grid2" style={{marginTop:6}}>
          <div><label className="lbl">Slide Duration (sec)</label>
            <select value={settings.duration} onChange={e=>save({settings:{...settings,duration:+e.target.value}})}>
              {[5,8,10,15,20,30].map(n=><option key={n} value={n}>{n} sec</option>)}
            </select></div>
          <div><label className="lbl">Theme</label>
            <select value={settings.theme} onChange={e=>save({settings:{...settings,theme:e.target.value}},'🎨 Theme changed')}>
              {THEME_OPTS.map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select></div>
          <div><label className="lbl">Slide Animation</label>
            <select value={settings.transition||'fade'} onChange={e=>save({settings:{...settings,transition:e.target.value}},'✨ Animation changed')}>
              {TRANS_OPTS.map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select></div>
          <div><label className="lbl">Clock (TV top corner)</label>
            <select value={settings.clock===false?'off':'on'} onChange={e=>save({settings:{...settings,clock:e.target.value==='on'}})}>
              <option value="on">🕐 Show</option><option value="off">Hide</option>
            </select></div>
          <div><label className="lbl">Loop Effect (slide full time)</label>
            <select value={settings.loop_fx||'none'} onChange={e=>save({settings:{...settings,loop_fx:e.target.value}},'💫 Loop effect set')}>
              {LOOP_OPTS.map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select></div>
        </div>

        <label className="lbl" style={{marginTop:12}}>🎨 Design Templates — onnu thattunga, preview paathu use pannunga</label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          {TEMPLATES.map(([id,ic,nm,desc,defs])=>(
            <div key={id} onClick={()=>save({settings:{...settings,template:id,...defs}},'🎨 '+nm+' template set!')}
              style={{border:(settings.template||'classic')===id?'2px solid var(--pink,#FF2E7E)':'1px solid var(--line)',
                borderRadius:12,padding:'10px 12px',cursor:'pointer',background:(settings.template||'classic')===id?'#fff5f9':'#fff'}}>
              <div style={{fontSize:22}}>{ic}</div>
              <b style={{fontSize:13}}>{nm}</b>
              <div className="muted" style={{fontSize:11}}>{desc}</div>
            </div>))}
        </div>

        <label className="lbl" style={{marginTop:12}}>👀 Live Preview — TV-la ipdi thaan varum</label>
        <div style={{borderRadius:14,overflow:'hidden',border:'1px solid var(--line)',position:'relative',
          background:pvTh.bg,color:pvTh.ink,aspectRatio:'16/9',display:'flex',alignItems:'center',
          justifyContent:'center',textAlign:'center'}} className={pvTh.animBg?'tvbganim':''}>
          <div key={pvKey} className={pvAnim} style={{width:'100%'}}>
            <div className={pvLoop} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
              {(settings.template==='popcard') ? (
                <div style={{position:'relative',width:110,height:120}}>
                  <div style={{position:'absolute',bottom:0,left:8,right:8,height:86,borderRadius:14,
                    background:'linear-gradient(135deg,#FF6A00,#FF2E7E,#7A2FF7)'}}/>
                  <div style={{position:'absolute',bottom:18,left:0,right:0,margin:'auto',width:84,height:84,
                    borderRadius:12,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',
                    transform:'rotate(-6deg)',fontSize:38,boxShadow:'0 8px 20px rgba(0,0,0,.3)'}}>🛍️</div>
                </div>
              ) : (settings.template==='bigtext') ? (
                <div style={{position:'relative',textAlign:'center'}}>
                  <div style={{fontSize:34,fontWeight:900,textTransform:'uppercase',opacity:.16,lineHeight:.9}}>SAMPLE</div>
                  <div style={{fontSize:38,marginTop:-18}}>🛍️</div>
                </div>
              ) : (settings.template==='gallery') ? (
                <>
                  <div style={{fontSize:9,letterSpacing:4,textTransform:'uppercase',color:pvTh.sub}}>— Our Collection —</div>

                <span style={{marginLeft:8,background:'#FF2E7E',color:'#fff',borderRadius:6,padding:'2px 8px',fontSize:10,fontWeight:800}}>OFFER</span></div>
              <div style={{fontSize:10,color:pvTh.sub}}>{(tv&&tv.name)||'Unga kadai'} · Powered by NammaOor</div>

          <button className="btn sm ghost" style={{position:'absolute',right:8,bottom:8,background:'rgba(255,255,255,.85)'}}

        </div>
        <label className="lbl" style={{marginTop:10}}>📰 Scrolling News Line (TV bottom-la odum)</label>
        <div className="row" style={{gap:8}}>
          <input className="input" style={{flex:1,margin:0}} placeholder="e.g. Deepavali Offer! 20% OFF ella items-um · Free home delivery 2km"
            value={ticker} onChange={e=>setTicker(e.target.value)}/>
          <button className="btn sm" onClick={()=>save({settings:{...settings,ticker:ticker.trim()}},ticker.trim()?'📰 News line set!':'News line removed')}>Save</button>
        </div>
      </div>

      <div className="card">
        <h3>🎞️ Slides ({slides.length})</h3>
        <p className="muted" style={{fontSize:12,marginTop:2}}>Products slide — kadai products auto-sync. ⏰ = slide-ku time set pannalaam (e.g. lunch offer 12-3 mattum).</p>
        {slides.map((s,i)=>{ const m=TYPE_META[s.type]||['📄',s.type]; return (
          <div key={s.id||i} style={{display:'flex',alignItems:'center',gap:6,borderBottom:'1px solid var(--line)',
            padding:'9px 0',opacity:s.hidden?.45:1,flexWrap:'wrap'}}>
            <span style={{fontSize:22}}>{m[0]}</span>
            <div style={{flex:1,minWidth:120}}>
              <b style={{fontSize:14}}>{s.title||m[1]}</b>
              <div className="muted" style={{fontSize:11.5}}>{m[1]}{s.hidden?' · hidden':''}
                {(s.from!=null&&s.from!=='')?` · ⏰ ${s.from}:00-${s.to}:00`:''}</div>
            </div>
            <button className="btn sm ghost" style={{fontSize:11}} onClick={()=>move(i,-1)} disabled={i===0}>↑ Mela</button>
            <button className="btn sm ghost" style={{fontSize:11}} onClick={()=>move(i,1)} disabled={i===slides.length-1}>↓ Keezha</button>
            <button className="btn sm ghost" style={{fontSize:11}} onClick={()=>sched(i)}>⏰ Time</button>
            <button className="btn sm ghost" style={{fontSize:11}} onClick={()=>toggleHide(i)}>{s.hidden?'👁 Show':'🙈 Hide'}</button>
            <button className="btn sm ghost" style={{fontSize:11}} onClick={()=>dup(i)}>⧉ Copy</button>
            <button className="btn sm ghost" style={{fontSize:11,color:'#c0392b'}} onClick={()=>del(i)}>✕ Delete</button>
          </div>)})}

        <h4 style={{margin:'14px 0 4px'}}>➕ Add Slide</h4>
        <div className="grid2">
          <select value={nt.type} onChange={e=>setNt({...nt,type:e.target.value})}>
            {Object.entries(TYPE_META).map(([k,[ic,l]])=><option key={k} value={k}>{ic} {l}</option>)}
          </select>
          <input className="input" placeholder="Title (optional)" value={nt.title} onChange={e=>setNt({...nt,title:e.target.value})}/>
        </div>
        {(nt.type==='text'||nt.type==='welcome')&&
          <textarea rows="2" placeholder="Text / message (optional)" value={nt.text} onChange={e=>setNt({...nt,text:e.target.value})}></textarea>}
        {nt.type==='video'&&<>
          <input className="input" placeholder="Video link (https://....mp4)" value={nt.video} onChange={e=>setNt({...nt,video:e.target.value})}/>
          <p className="muted" style={{fontSize:11.5,marginTop:2}}>Direct .mp4 link mattum work aagum (YouTube link aagathu). Video TV-la mute-la loop aagum.</p></>}
        <button className="btn sm" style={{marginTop:6}} onClick={addSlide}>
          {nt.type==='image'?'📷 Poster upload panni add':'+ Add Slide'}</button>
      </div>

      <div className="card">
        <h3>🎵 Music & Audio</h3>
        <p className="muted" style={{fontSize:12,marginTop:2}}>
          Unga sontha audio-va mattum upload pannunga (MP3/WAV/AAC/M4A/OGG, max 12 MB).
          NammaOor engendhum paattu download pannaathu — neenga upload panradhu mattum play aagum.</p>

        <h4 style={{margin:'10px 0 4px'}}>🎶 Background Music — Playlist ({playlistM.length}/10)</h4>
        <p className="muted" style={{fontSize:11.5,marginTop:0}}>
          Full song play aagum — slides maarinaalum paattu nikkaathu. Oru song mudinja adutha song thaana start.
          Ellam mudinja first song-la irundhu repeat. 🔁</p>
        {playlistM.length>0 ? <>
          {playlistM.map((sg,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:8,borderBottom:'1px solid var(--line)',padding:'7px 0'}}>
              <b style={{fontSize:13,width:20}}>{i+1}.</b>
              <div style={{flex:1,minWidth:0}}>
                <b style={{fontSize:12.5,display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>🎵 {sg.name}</b>
                <audio controls src={sg.url} style={{width:'100%',height:30,marginTop:3}}/>
              </div>
              <button className="btn sm ghost" style={{color:'#c0392b',fontSize:11}} onClick={()=>delAudio('music',i)}>✕</button>
            </div>))}
          {playlistM.length<10 &&
            <button className="btn sm ghost" style={{marginTop:8}} disabled={busy==='music'} onClick={()=>uploadAudio('music')}>
              {busy==='music'?'⏳ Uploading…':'➕ Add Song'}</button>}
          <div className="grid2" style={{marginTop:10}}>
            <div><label className="lbl">🔊 Volume ({settings.audio_vol==null?70:settings.audio_vol}%)</label>
              <input type="range" min="0" max="100" style={{width:'100%'}}
                defaultValue={settings.audio_vol==null?70:settings.audio_vol}
                onMouseUp={e=>save({settings:{...settings,audio_vol:+e.target.value}},'🔊 Volume set')}
                onTouchEnd={e=>save({settings:{...settings,audio_vol:+e.target.value}},'🔊 Volume set')}/></div>
            <div><label className="lbl">Repeat</label>
              <select value={settings.audio_loop===false?'off':'on'}
                onChange={e=>save({settings:{...settings,audio_loop:e.target.value==='on'}})}>
                <option value="on">🔁 Playlist repeat</option><option value="off">Once only (stop at end)</option></select></div>
            <div><label className="lbl">Fade In / Out</label>
              <select value={settings.audio_fade===false?'off':'on'}
                onChange={e=>save({settings:{...settings,audio_fade:e.target.value==='on'}})}>
                <option value="on">🌊 Smooth fade</option><option value="off">Direct</option></select></div>
            <div><label className="lbl">Mute</label>
              <select value={settings.audio_mute?'on':'off'}
                onChange={e=>save({settings:{...settings,audio_mute:e.target.value==='on'}},e.target.value==='on'?'🔇 Muted':'🔊 Unmuted')}>
                <option value="off">🔊 Sound On</option><option value="on">🔇 Mute</option></select></div>
          </div>
        </> : <button className="btn sm" disabled={busy==='music'} onClick={()=>uploadAudio('music')}>
          {busy==='music'?'⏳ Uploading…':'⬆️ Upload First Song'}</button>}

        <h4 style={{margin:'16px 0 4px'}}>🎙️ Voice Announcement</h4>
        <p className="muted" style={{fontSize:12,marginTop:0}}>
          Unga voice-la record panni upload pannunga — e.g. "Welcome to our shop!", "Today's offer: Buy 2 Get 1 Free".
          Music konjam kammi aagi, announcement play aagi, thirumba music varum.</p>
        {announce ? <>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <span style={{fontSize:20}}>🎙️</span>
            <b style={{fontSize:13,flex:1,minWidth:120,overflow:'hidden',textOverflow:'ellipsis'}}>{announce.name}</b>
            <button className="btn sm ghost" disabled={busy==='announce'} onClick={()=>uploadAudio('announce')}>🔁 Replace</button>
            <button className="btn sm ghost" style={{color:'#c0392b'}} onClick={()=>delAudio('announce')}>🗑 Delete</button>
          </div>
          <audio controls src={announce.url} style={{width:'100%',marginTop:8,height:36}}/>
          <label className="lbl" style={{marginTop:8}}>Eppo play aaganum?</label>
          <select value={settings.announce_every||5}
            onChange={e=>save({settings:{...settings,announce_every:+e.target.value}},'🎙️ Announcement timing set')}>
            {[2,3,5,8,10,15].map(n=><option key={n} value={n}>Every {n} slides</option>)}
          </select>
        </> : <button className="btn sm ghost" disabled={busy==='announce'} onClick={()=>uploadAudio('announce')}>
          {busy==='announce'?'⏳ Uploading…':'⬆️ Upload Voice Announcement'}</button>}

        <p className="muted" style={{fontSize:11,marginTop:12,borderTop:'1px solid var(--line)',paddingTop:8}}>
          ⚠️ TV-la first time sound varanum-na, TV remote-la OK button oru thadava press pannanum
          (browser rule — auto-sound block). Adhukku appuram thaana play aagum.</p>
      </div>

      <div className="card" style={{background:'#f6f3ff'}}>
        <b>📡 TV-la open panna:</b> <span style={{fontFamily:'monospace'}}>nammaoor.shop/#/tv</span>
        <p className="muted" style={{fontSize:12,marginTop:6}}>Android TV / Smart TV browser-la intha link open pannunga. TV internet-la irundha, neenga enga irundhaalum control pannalaam — maathangal ~30 sec-la TV-la varum.</p>
      </div>
      {msg&&<p style={{color:'var(--teal)'}}>{msg}</p>}
    </>}
  </div></>)
}


/* ===== pages/Login.jsx ===== */

function Login(){
  const nav=useNavigate()
  // preselect tab from ?tab=employee (e.g. "கடை பதிவு" button routes here)
  const _lh=(typeof window!=='undefined' && window.location.hash)||''
  const _lq=_lh.includes('?')?_lh.split('?')[1]:(typeof window!=='undefined'?window.location.search.slice(1):'')
  const _tabQ=new URLSearchParams(_lq).get('tab')
  const [tab,setTab]=useState(_tabQ==='employee'?'employee':'owner'); const [msg,setMsg]=useState('')
  // owner OTP
  const [mobile,setMobile]=useState(''); const [code,setCode]=useState(''); const [sent,setSent]=useState(false)
  const [otpUntil,setOtpUntil]=useState(0)
  // shop owner (mobile + password) + which role is doing "forgot password"
  const [op,setOp]=useState(''); const [forgotMode,setForgotMode]=useState('emp')
  // employee
  const [u,setU]=useState(''); const [p,setP]=useState('')
  // admin (hidden)
  const [showAdmin,setShowAdmin]=useState(false)
  // forgot (employee)
  const [showForgot,setShowForgot]=useState(false)
  const [fMobile,setFMobile]=useState(''); const [fCode,setFCode]=useState(''); const [fNew,setFNew]=useState('')
  const [fSent,setFSent]=useState(false); const [fUntil,setFUntil]=useState(0); const [fDone,setFDone]=useState(null)
  // employee self sign-up (username + mobile + email(optional) + password + confirm + OTP)
  const [showSignup,setShowSignup]=useState(false)
  const [sUser,setSUser]=useState(''); const [sMobile,setSMobile]=useState(''); const [sEmail,setSEmail]=useState('')
  const [sPass,setSPass]=useState(''); const [sPass2,setSPass2]=useState('')
  const [sOtp,setSOtp]=useState(''); const [sSent,setSSent]=useState(false); const [sUntil,setSUntil]=useState(0)
  // 1-second ticker for countdowns
  const [,setTick]=useState(0)
  useEffect(()=>{ const t=setInterval(()=>setTick(x=>x+1),1000); return ()=>clearInterval(t) },[])
  const left=(until)=> until? Math.max(0, Math.ceil((until-Date.now())/1000)) : 0

  function go(role){ setRole(role); nav('/app/'+(role==='super_admin'?'admin':role==='shop_owner'?'owner':role)) }

  // shop owner: mobile + password login
  async function ownerLogin(){ try{ const r=await api.post('/auth/owner/login',{mobile,password:op}); setToken(r.access_token); go('shop_owner') }
    catch(e){ setMsg('❌ '+e.message) } }
  async function empLogin(){ try{ const r=await api.post('/auth/employee/login',{emp_code:u,password:p}); setToken(r.access_token); go('employee') }
    catch(e){ setMsg('❌ '+e.message) } }
  async function adminLogin(){ try{ const r=await api.post('/auth/admin/login',{username:u,password:p}); setToken(r.access_token); go('super_admin') }
    catch(e){ setMsg('❌ '+e.message) } }
  // forgot (works for owner + employee based on forgotMode)
  async function fReq(){ try{ const ep=forgotMode==='owner'?'/auth/owner/forgot/request':'/auth/forgot/request'
    await api.post(ep,{mobile:fMobile}); setFSent(true)
    setFUntil(Date.now()+60000); setMsg('✅ OTP sent to your number. Valid 5 min.') }
    catch(e){ setMsg('❌ '+e.message) } }
  async function fReset(){ try{ const ep=forgotMode==='owner'?'/auth/owner/forgot/reset':'/auth/forgot/reset'
    const r=await api.post(ep,{mobile:fMobile,code:fCode,new_password:fNew})
    setFDone(r.username||fMobile); setMsg('') } catch(e){ setMsg('❌ '+e.message) } }

  const backToLogin=()=>{ setShowForgot(false); setFSent(false); setFDone(null); setFMobile(''); setFCode(''); setFNew(''); setForgotMode('emp'); setMsg('') }
  // employee sign-up — step 1: send OTP; step 2: verify + create + auto-login to dashboard
  const _signupPayload=()=>({username:sUser,mobile:sMobile,email:sEmail||null,password:sPass})
  async function signupStart(){
    if(sPass!==sPass2){ setMsg('❌ Password rendum match aagala'); return }
    try{ await api.post('/auth/employee/signup/start',_signupPayload())
      setSSent(true); setSUntil(Date.now()+60000); setMsg('✅ OTP sent to '+sMobile+'. Valid 5 min.') }
    catch(e){ setMsg('❌ '+e.message) } }
  async function signupVerify(){
    try{ const r=await api.post('/auth/employee/signup/verify',{..._signupPayload(),code:(sOtp||'').trim()})
      setToken(r.access_token); go('employee') }
    catch(e){ setMsg('❌ '+e.message) } }
  const backFromSignup=()=>{ setShowSignup(false); setSUser(''); setSMobile(''); setSEmail(''); setSPass(''); setSPass2(''); setSOtp(''); setSSent(false); setMsg('') }

  return (<><Header/><div className="container" style={{maxWidth:440}}>
    <h2 className="brand">Login</h2>

    {/* ---------- FORGOT PASSWORD (employee) ---------- */}
    {showForgot && <div className="card">
      <div className="row" style={{justifyContent:'space-between',alignItems:'center'}}>
        <b>🔑 Reset {forgotMode==='owner'?'Shop Owner':'Employee'} Password</b>
        <a className="muted" style={{cursor:'pointer'}} onClick={backToLogin}>← Back</a>
      </div>
      {fDone ? <>
        <div style={{padding:12,background:'#eafaf4',borderRadius:10}}>
          <p>✅ Password changed!</p>
          <p>Your username: <b>{fDone}</b></p>
        </div>
        <button className="btn" style={{marginTop:10}} onClick={backToLogin}>Go to Login</button>
      </> : <>
        <label style={{marginTop:8}}>Registered Mobile Number</label>
        <input className="input" value={fMobile} onChange={e=>setFMobile(e.target.value)} placeholder="10-digit mobile"/>
        {!fSent
          ? <button className="btn" onClick={fReq}>Send OTP</button>
          : <>
              <label>Enter OTP</label>
              <input className="input" value={fCode} onChange={e=>setFCode(e.target.value)}/>
              <label>New Password</label>
              <PwInput value={fNew} onChange={e=>setFNew(e.target.value)} placeholder="New password (min 6)"/>
              <button className="btn" style={{marginTop:8}} onClick={fReset}>Reset Password</button>
              <div style={{marginTop:8}}>
                {left(fUntil)>0
                  ? <span className="muted">Resend OTP in {left(fUntil)}s</span>
                  : <a style={{cursor:'pointer',color:'var(--purple)'}} onClick={fReq}>Resend OTP</a>}
              </div>
            </>}
      </>}
      <p style={{marginTop:10,color:'var(--teal)'}}>{msg}</p>
    </div>}

    {/* ---------- EMPLOYEE SIGN-UP ---------- */}
    {showSignup && <div className="card">
      <div className="row" style={{justifyContent:'space-between',alignItems:'center'}}>
        <b>🧑‍💼 New Account — Sign Up</b>
        <a className="muted" style={{cursor:'pointer'}} onClick={backFromSignup}>← Back</a>
      </div>
      {!sSent ? <>
        <label style={{marginTop:8}}>Username</label>
        <input className="input" value={sUser} onChange={e=>setSUser(e.target.value)} placeholder="Any username (min 3, no spaces)"/>
        <label>Mobile Number</label>
        <input className="input" value={sMobile} onChange={e=>setSMobile(e.target.value)} placeholder="10-digit mobile"/>
        <label>Email <span className="muted">(optional)</span></label>
        <input className="input" value={sEmail} onChange={e=>setSEmail(e.target.value)} placeholder="you@email.com"/>
        <label>Set Password</label>
        <PwInput value={sPass} onChange={e=>setSPass(e.target.value)} placeholder="Password (min 6)"/>
        <label>Confirm Password</label>
        <PwInput value={sPass2} onChange={e=>setSPass2(e.target.value)} placeholder="Re-enter password"/>
        <button className="btn" style={{marginTop:10}} onClick={signupStart}
          disabled={sUser.length<3||!sMobile||sPass.length<6||sPass!==sPass2}>Send OTP</button>
        {sPass2 && sPass!==sPass2 && <p style={{color:'#e74c3c',marginTop:6,fontSize:13}}>Password match aagala</p>}
        <p className="muted" style={{marginTop:8,fontSize:12}}>Sign up panna ungaloda mobile-ku OTP varum. Verify pannina udaney dashboard open aagum.</p>
      </> : <>
        <div style={{padding:10,background:'#eafaf4',borderRadius:10,marginTop:8}}>
          <p style={{margin:0}}>📲 OTP sent to <b>{sMobile}</b></p>
        </div>
        <label style={{marginTop:8}}>Enter OTP</label>
        <input className="input" value={sOtp} onChange={e=>setSOtp(e.target.value)} placeholder="6-digit OTP"/>
        <button className="btn" style={{marginTop:8}} onClick={signupVerify} disabled={!sOtp}>Verify &amp; Create Account</button>
        <div style={{marginTop:8}}>
          {left(sUntil)>0
            ? <span className="muted">Resend OTP in {left(sUntil)}s</span>
            : <a style={{cursor:'pointer',color:'var(--purple)'}} onClick={signupStart}>Resend OTP</a>}
        </div>
      </>}
      <p style={{marginTop:10,color:'var(--teal)'}}>{msg}</p>
    </div>}

    {/* ---------- MAIN LOGIN ---------- */}
    {!showForgot && !showAdmin && !showSignup && <>
      <div className="tabs">
        <div className={'tabx'+(tab==='owner'?' on':'')} onClick={()=>{setTab('owner');setMsg('')}}>Shop Owner</div>
        <div className={'tabx'+(tab==='employee'?' on':'')} onClick={()=>{setTab('employee');setMsg('')}}>Employee</div>
      </div>
      <div className="card">
        {tab==='owner' && <>
          <label>Mobile Number</label>
          <input className="input" value={mobile} onChange={e=>setMobile(e.target.value)} placeholder="10-digit mobile"/>
          <label>Password</label>
          <PwInput value={op} onChange={e=>setOp(e.target.value)}/>
          <button className="btn" style={{marginTop:8}} onClick={ownerLogin} disabled={!mobile||!op}>Login</button>
          <div style={{marginTop:8}}>
            <a className="muted" style={{cursor:'pointer',color:'var(--purple)'}}
               onClick={()=>{setForgotMode('owner');setShowForgot(true);setMsg('')}}>Forgot password?</a>
          </div>
          <p className="muted" style={{marginTop:10,fontSize:12}}>Registration-la set panna password vachu login pannunga.</p>
        </>}
        {tab==='employee' && <>
          <label>Username or Employee ID</label>
          <input className="input" value={u} onChange={e=>setU(e.target.value)} placeholder="your username / EMP-0001"/>
          <label>Password</label>
          <PwInput value={p} onChange={e=>setP(e.target.value)}/>
          <button className="btn" style={{marginTop:8}} onClick={empLogin}>Login</button>
          <div className="row" style={{justifyContent:'space-between',marginTop:8}}>
            <a className="muted" style={{cursor:'pointer',color:'var(--purple)'}}
               onClick={()=>{setForgotMode('emp');setShowForgot(true);setMsg('')}}>Forgot password?</a>
            <a style={{cursor:'pointer',color:'var(--purple)',fontWeight:700}}
               onClick={()=>{setShowSignup(true);setMsg('')}}>New? Sign up →</a>
          </div>
          <p className="muted" style={{marginTop:10,fontSize:12}}>Kadai register panna sign up pannunga → OTP verify → dashboard-la irundhu kadai add pannalaam.</p>
        </>}
        <p style={{marginTop:10,color:'var(--teal)'}}>{msg}</p>
      </div>
    </>}

    {/* ---------- HIDDEN ADMIN ---------- */}
    {showAdmin && <div className="card">
      <div className="row" style={{justifyContent:'space-between',alignItems:'center'}}>
        <b>🛡️ Admin Login</b>
        <a className="muted" style={{cursor:'pointer'}} onClick={()=>{setShowAdmin(false);setMsg('')}}>← Back</a>
      </div>
      <label style={{marginTop:8}}>Username</label>
      <input className="input" value={u} onChange={e=>setU(e.target.value)}/>
      <label>Password</label>
      <PwInput value={p} onChange={e=>setP(e.target.value)}/>
      <button className="btn" style={{marginTop:8}} onClick={adminLogin}>Login</button>
      <p style={{marginTop:10,color:'var(--teal)'}}>{msg}</p>
    </div>}

    {!showForgot && !showSignup && <div style={{textAlign:'center',marginTop:16,opacity:.35,cursor:'pointer',userSelect:'none'}}
         onClick={()=>{setShowAdmin(v=>!v);setU('');setP('');setMsg('')}} title="admin">🔒</div>}
  </div></>)
}


/* ===== pages/OwnerDashboard.jsx ===== */
function OwnerDashboard(){
  const [s,setS]=useState(null); const [an,setAn]=useState({}); const [pays,setPays]=useState([])
  const [prod,setProd]=useState({name:'',price:''}); const [offer,setOffer]=useState({title:'',detail:''})
  const [edit,setEdit]=useState(null); const [ef,setEf]=useState({name:'',price:''})
  const [psearch,setPsearch]=useState(''); const [msg,setMsg]=useState('')
  const [route,setRoute]=useState(null); const [bankF,setBankF]=useState({bank_account:'',bank_ifsc:'',beneficiary_name:'',pan:'',email:''})
  // Master Catalog
  const [mcCats,setMcCats]=useState([]); const [mcSubs,setMcSubs]=useState([])
  const [mcCat,setMcCat]=useState(''); const [mcSub,setMcSub]=useState('')
  const [mcItems,setMcItems]=useState([]); const [mcSel,setMcSel]=useState({})
  const [mcLoading,setMcLoading]=useState(false); const [mcMsg,setMcMsg]=useState('')
  const load=()=>{ api.get('/me/shop').then(setS).catch(e=>setMsg(e.message))
    api.get('/me/shop/analytics').then(setAn).catch(()=>{})
    api.get('/me/shop/payments').then(setPays).catch(()=>{})
    api.get('/me/shop/route/status').then(setRoute).catch(()=>{}) }
  useEffect(load,[])
  useEffect(()=>{ api.get('/catalog/categories').then(setMcCats).catch(()=>{}) },[])
  const pickCat=(c)=>{ setMcCat(c); setMcSub(''); setMcItems([]); setMcSel({}); setMcSubs([]); setMcMsg('')
    if(c) api.get('/catalog/subcategories?category='+encodeURIComponent(c)).then(setMcSubs).catch(()=>{}) }
  const pickSub=(sub)=>{ setMcSub(sub); setMcItems([]); setMcSel({}); setMcMsg('')
    if(sub){ setMcLoading(true)
      api.get('/catalog/master?limit=1000&category='+encodeURIComponent(mcCat)+'&sub_category='+encodeURIComponent(sub))
        .then(r=>{ setMcItems(r.items||[]); setMcLoading(false) }).catch(()=>setMcLoading(false)) } }
  const mcTog=(it,on)=>setMcSel(x=>({...x,[it.product_id]:{...(x[it.product_id]||{}),on,name:it.name,unit:it.unit}}))
  const mcUpd=(pid,k,v)=>setMcSel(x=>({...x,[pid]:{...(x[pid]||{}),[k]:v}}))
  const mcPhoto=async(pid)=>{ const d=await pickImage(700); if(d) mcUpd(pid,'img',d) }
  const saveMc=async()=>{
    const items=Object.entries(mcSel).filter(([,v])=>v.on).map(([pid,v])=>({
      master_product_id:pid, name:v.name, category:mcCat, subcategory:mcSub, unit:v.unit, image:v.img||null,
      price:v.price?+v.price:null, offer_price:v.offer?+v.offer:null, stock:v.stock?+v.stock:null }))
    if(!items.length){ setMcMsg('Products select pannunga'); return }
    try{ const r=await api.post('/me/shop/catalog/bulk',{items})
      setMcMsg(`✅ ${r.added} products add aayiduchu! Customer app-la ippove varum.`); setMcSel({}) }
    catch(e){ setMcMsg('❌ '+e.message) } }
  if(!s) return <><Header/><div className="container"><div className="card">{msg||'Loading...'}<p className="muted">Shop owner-aa login pannirukanum.</p></div></div></>
  const save=async(patch,note)=>{ await api.patch('/me/shop',patch); setMsg(note||'Saved'); load() }
  // Validate + https-prepend a social/website link. Empty clears it (hides the button).
  const normUrl=(v)=>{ v=(v||'').trim(); if(!v) return ''
    if(!/^https?:\/\//i.test(v)) v='https://'+v.replace(/^\/+/,'')
    if(!/^https?:\/\/[\w.-]+\.[A-Za-z]{2,}/i.test(v)) return null; return v }
  const saveLink=async(field,label,current)=>{
    const raw=prompt(label+' (empty to remove)', current||''); if(raw==null) return
    const v=normUrl(raw); if(v===null){ setMsg('❌ Invalid link — check and try again'); return }
    await save({[field]:v}, v?(label+' saved'):(label+' removed')) }
  const saveNum=async(field,label,current)=>{
    const raw=prompt(label+' (10-digit mobile, empty to remove)', current||''); if(raw==null) return
    const d=(raw||'').replace(/\D/g,''); if(raw.trim() && d.length<10){ setMsg('❌ Enter a valid 10-digit number'); return }
    await save({[field]:d.slice(-10)}, d?(label+' saved'):(label+' removed')) }
  const onboardRoute=async()=>{ if(!bankF.bank_account||!bankF.bank_ifsc||!bankF.beneficiary_name){setMsg('Bank details fill pannunga');return} try{ const r=await api.post('/me/shop/route/onboard',bankF); setMsg(r.note||'Payout account submitted'); api.get('/me/shop/route/status').then(setRoute) }catch(e){setMsg(e.message)} }
  const addProduct=async()=>{ await api.post('/me/shop/products',{name:prod.name,price:prod.price?+prod.price:null}); setProd({name:'',price:''}); load() }
  const delProduct=async(id)=>{ await api.del('/me/shop/products/'+id); load() }
  const saveEdit=async(id)=>{ await api.patch('/me/shop/products/'+id,{name:ef.name,price:ef.price?+ef.price:null}); setEdit(null); load() }
  const addOffer=async()=>{ await api.post('/me/shop/offers',offer); setOffer({title:'',detail:''}); load() }
  const delOffer=async(id)=>{ await api.del('/me/shop/offers/'+id); load() }
  const renew=async()=>{ const r=await api.post('/me/shop/renew'); if(r.gateway==='razorpay'&&window.Razorpay){ new window.Razorpay({key:r.key_id,amount:r.amount*100,currency:'INR',name:'NammaOor',description:'Renewal Rs.299',order_id:r.order_id,theme:{color:'#FF2E7E'},handler:async(x)=>{await api.post('/payments/verify',{razorpay_order_id:x.razorpay_order_id,razorpay_payment_id:x.razorpay_payment_id,razorpay_signature:x.razorpay_signature});setMsg('Renewed!');load()}}).open() } else { await api.post(`/payments/dev/mark-paid/${r.txn_id}`); setMsg('Renewed 3 months'); load() } }
  const startAutopay=async()=>{ try{
      const r=await api.post('/payments/subscription/start')

        new window.Razorpay({key:r.key_id, subscription_id:r.subscription_id,
          name:'NammaOor', description:'₹99/month UPI Autopay', theme:{color:'#FF2E7E'},
          handler:async(x)=>{ try{ await api.post('/payments/subscription/verify',{
              razorpay_payment_id:x.razorpay_payment_id,
              razorpay_subscription_id:x.razorpay_subscription_id,
              razorpay_signature:x.razorpay_signature})
            setMsg('✅ Autopay active! Ini month-a-month automatic.'); load() }
            catch(e){ setMsg('Verify failed: '+e.message) } }}).open()
      } else setMsg('Autopay available illa — ₹299 renew use pannunga')
    }catch(e){ setMsg('Autopay: '+e.message+' — ₹299 renew use pannunga') } }
  const editShopName=async()=>{ const v=prompt('Shop Name', s.shop_name||''); if(v==null)return
    const nm=v.trim(); if(nm.length<3){ setMsg('❌ Shop name romba chinnadhu'); return }
    await save({shop_name:nm},'✅ Shop name updated') }
  const daysLeft = s.expires_at ? Math.max(0, Math.ceil((new Date(s.expires_at)-new Date())/86400000)) : 0
  const expired = (s.status==='expired') || (s.expires_at && new Date(s.expires_at) < new Date())
  const pub=`${SITE}/#/shop/${(s.shop_code||'').replace('-','')}`
  const fp = pays.filter(p=>!psearch || (p.gateway_payment_id||'').includes(psearch) || (''+p.amount).includes(psearch) || (p.status||'').includes(psearch))

  // ---- LOCKED: 3-month plan expired -> pay ₹299 to unlock ----
  if(expired) return (<><Header/><div className="container" style={{maxWidth:460}}>
    <div className="card" style={{textAlign:'center',border:'2px solid #ffd0d0'}}>
      <div style={{fontSize:52,margin:'6px 0'}}>🔒</div>
      <h2 className="brand">Plan Mudinjiduchu</h2>
      <p style={{fontWeight:700,color:'#c0392b',marginTop:8}}>Ungaloda membership {s.expires_at?('('+new Date(s.expires_at).toDateString()+') '):''}mudinjiduchu.</p>
      <p className="muted" style={{marginTop:8}}>Best option: <b>₹99/month UPI Autopay</b> — innaiku chinna authorization amount mattum, appuram every month automatic. Marakka vendam, lock aagaadhu!</p>
      <button className="btn" style={{marginTop:14,padding:'15px 24px',fontSize:17,width:'100%'}} onClick={startAutopay}>⚡ Start ₹99/month Autopay</button>
      <button className="btn ghost" style={{marginTop:10,width:'100%'}} onClick={renew}>💳 One-time ₹299 · 3 Months</button>
      <p style={{color:'var(--teal)',marginTop:10}}>{msg}</p>
      <p className="muted" style={{marginTop:10,fontSize:12}}>Renewal panna mudiyalaya? Support-a contact pannunga.</p>
    </div>
  </div></>)

  return (<><Header/><div className="container">
    <h2 className="brand">{s.shop_name} <button className="btn sm ghost" title="Edit shop name"
      style={{verticalAlign:'middle',marginLeft:6}} onClick={editShopName}>✏️</button></h2>
    <p className="muted">{s.shop_code} - <span className="pill">{s.status}</span> {s.bio&&<span> - {s.bio}</span>}</p>
    <div className="row" style={{marginTop:12}}>
      <div className="kpi"><b>{an.qr_scans||0}</b><span>QR Scans</span></div>
      <div className="kpi"><b>{an.pay_now||0}</b><span>Pay Now</span></div>
      <div className="kpi"><b>{an.calls||0}</b><span>Calls</span></div>
      <div className="kpi"><b>{an.whatsapp||0}</b><span>WhatsApp</span></div>
    </div>

    <div className="grid2" style={{marginTop:14}}>

        <button className="btn" style={{width:'100%',marginTop:8}}
          onClick={()=>downloadFile('/me/shop/poster','nammaoor_poster.pdf')}>
          🖨 Download Poster (print & stick)</button></div>
      <div className="card"><h3>Membership</h3>
        <p className="muted">Plan: <b>{s.subscription_id?'₹99/month UPI Autopay ⚡':'NammaOor Basic'}</b></p>

                  value={sel.price||''} onChange={e=>mcUpd(it.product_id,'price',e.target.value)}/>

// client-side image enhance (brightness/contrast) + thumbnail — free, no API
function enhance(dataUrl, bright, contrast, maxW){
  return new Promise(res=>{
    const img=new Image()
    img.onload=()=>{
      const sc=Math.min(1,(maxW||1000)/img.width), w=img.width*sc, h=img.height*sc
      const c=document.createElement('canvas'); c.width=w; c.height=h
      const ctx=c.getContext('2d')
      ctx.filter=`brightness(${bright}%) contrast(${contrast}%)`
      ctx.drawImage(img,0,0,w,h)
      res(c.toDataURL('image/jpeg',0.78))
    }
    img.src=dataUrl
  })
}

          <option value="cancelled">cancelled</option>
        </select>
      </div>)}
    </div>
  </div></>)
}

      catch(e){ setGMsg('❌ '+(e.message||'No new QR — generate first')) } }
  const verify=async()=>{ await api.patch('/me/employee/verification',ver); setMsg('✅ Verified'); load() }
  const withdraw=async()=>{ try{await api.post('/me/employee/withdrawals',{amount:+amt}); setMsg('✅ Requested'); load()}catch(e){setMsg('❌ '+e.message)} }
  const regUrl=`${SITE}/#/register?emp=${(d.emp_code||'').replace('-','')}`
  const regHref=`#/register?emp=${(d.emp_code||'').replace('-','')}`
  return (<><Header/><div className="container">
    <h2 className="brand">Employee — {d.emp_code}</h2>

    <div className="row" style={{marginTop:10}}>
      <div className="kpi"><b>₹{d.wallet_balance}</b><span>Wallet</span></div>
      <div className="kpi"><b>{d.total_registrations}</b><span>Total Shops</span></div>
      <div className="kpi"><b>{d.today_registrations}</b><span>Today</span></div>
      <div className="kpi"><b>{d.is_verified?'✅':'❌'}</b><span>Verified</span></div>
    </div>
    <div className="card" style={{marginTop:14}}><h3>📦 My QR Stickers (Admin assigned)</h3>
      <div className="row">
        <div className="kpi"><b>{inv.assigned||0}</b><span>Total Assigned</span></div>
        <div className="kpi"><b>{inv.available||0}</b><span>Available</span></div>
        <div className="kpi"><b>{inv.used||0}</b><span>Used</span></div>
      </div>
      {inv.tokens && inv.tokens.length>0 && <p className="muted" style={{marginTop:8}}>Next codes: {inv.tokens.slice(0,8).join(', ')}…</p>}
    </div>
    <div className="card" style={{marginTop:14}}><h3>🖨️ Generate QR (Self)</h3>
      <div className="row" style={{alignItems:'flex-end',gap:8,flexWrap:'wrap'}}>
        <div><label>Ethana QR?</label>
          <input className="input" type="number" min="1" max={inv.left_today??100} value={genN}
            onChange={e=>setGenN(e.target.value)} style={{width:110}}/></div>
        <button className="btn" onClick={genQr} disabled={(inv.left_today??100)<=0}>⚡ Generate QR</button>
        <button className="btn ghost" onClick={dlQr}>⬇️ Download &amp; Print</button>
      </div>
      <p className="muted" style={{marginTop:6}}>Today: {inv.made_today||0}/100 generated · {inv.left_today??100} left</p>
      <p style={{marginTop:8,fontSize:13,fontWeight:600,color:'#6c5ce7'}}>Per day 100 QR only. Take print out and paste to your shop.</p>
      {gMsg && <p style={{color:'var(--teal)',marginTop:6}}>{gMsg}</p>}
    </div>
    <div className="grid2">
      <div className="card"><h3>📱 My Registration QR</h3>
        <div className="qrbox" style={{margin:'10px auto'}}><img src={qrImg(regUrl)}/></div>
        <p className="muted" style={{textAlign:'center'}}>{regUrl}</p></div>
      <div className="card"><h3>💸 Withdrawal (min ₹500)</h3>
        {!d.is_verified && <><input className="input" placeholder="UPI ID" onChange={e=>setVer({...ver,upi_id:e.target.value})}/>
          <input className="input" placeholder="UPI Name" onChange={e=>setVer({...ver,upi_name:e.target.value})}/>
          <button className="btn sm" onClick={verify}>Verify UPI</button></>}
        {d.is_verified && <><input className="input" placeholder="Amount" value={amt} onChange={e=>setAmt(e.target.value)}/>
          <button className="btn" onClick={withdraw}>Request Withdrawal</button></>}
        <p style={{color:'var(--teal)',marginTop:8}}>{msg}</p></div>
    </div>
    <div className="card"><h3>My Withdrawals</h3>
      <table><tr><th>Requested</th><th>Amount</th><th>Status</th><th>Paid On</th></tr>
        {wh.map((w,i)=><tr key={i}><td>{w.created_at?new Date(w.created_at).toLocaleDateString():'-'}</td><td>Rs.{w.amount}</td>
          <td><span className={'tag '+(['completed','paid'].includes(w.status)?'a':'e')}>{w.status}</span></td>
          <td>{w.paid_at?new Date(w.paid_at).toLocaleDateString():'-'}</td></tr>)}
      </table>{wh.length===0 && <p className="muted">No withdrawals yet.</p>}
    </div>
    <div className="card"><h3>🏪 My Shops</h3>
      <table><tr><th>ID</th><th>Shop</th><th>Status</th></tr>
        {shops.map((s,i)=><tr key={i}><td>{s.shop_code||'draft'}</td><td>{s.shop_name}</td><td><span className={'tag '+(s.status==='active'?'a':'e')}>{s.status}</span></td></tr>)}
      </table>{shops.length===0 && <p className="muted">இன்னும் shops இல்ல.</p>}</div>
  </div></>)
}


/* ===== pages/AdminDashboard.jsx ===== */
function AdminDashboard(){
  const [rev,setRev]=useState({}); const [an,setAn]=useState({}); const [shops,setShops]=useState([])
  const [wd,setWd]=useState([]); const [emps,setEmps]=useState([]); const [qr,setQr]=useState({})
  const [genN,setGenN]=useState(50); const [asg,setAsg]=useState({emp_code:'',count:10}); const [dlN,setDlN]=useState(10)
  const [newEmp,setNewEmp]=useState({full_name:'',mobile:'',password:'',district_id:''})
  const [cred,setCred]=useState(null); const [empSearch,setEmpSearch]=useState(''); const [empDet,setEmpDet]=useState(null)
  const [shopSearch,setShopSearch]=useState(''); const [ov,setOv]=useState({}); const [msg,setMsg]=useState('')
  const [pw,setPw]=useState({current:'',next:''})
  // Master Catalog admin
  const [catStats,setCatStats]=useState({total:0,categories:[]})
  const [mcForm,setMcForm]=useState({name:'',category:'',sub_category:'',unit:'Piece',product_type:'Product'})
  const [csvText,setCsvText]=useState(''); const [imp,setImp]=useState(null); const [catMsg,setCatMsg]=useState('')
  const [dragOver,setDragOver]=useState(false); const [busy,setBusy]=useState(false)
  const load=()=>{ api.get('/admin/revenue').then(setRev).catch(e=>setMsg(e.message))
    api.get('/admin/catalog/stats').then(setCatStats).catch(()=>{})
    api.get('/admin/analytics').then(setAn).catch(()=>{}); api.get('/admin/shops').then(setShops).catch(()=>{})
    api.get('/admin/withdrawals/all').then(setWd).catch(()=>api.get('/admin/withdrawals').then(setWd).catch(()=>{}))
    api.get('/admin/employees').then(setEmps).catch(()=>{}); api.get('/admin/qr/stats').then(setQr).catch(()=>{}); api.get('/admin/overview').then(setOv).catch(()=>{}) }
  useEffect(load,[])
  const changePw=async()=>{ if(pw.next.length<6){setMsg('New password min 6 chars');return} try{ await api.post('/admin/change-password',{current_password:pw.current,new_password:pw.next}); setMsg('✅ Password changed. Use it next login.'); setPw({current:'',next:''}) }catch(e){ setMsg('❌ '+e.message) } }
  if(msg && !rev.active_shops && rev.active_shops!==0) return <><Header/><div className="container"><div className="card">{msg}</div></div></>
  const genQr=async()=>{ const r=await api.post('/admin/qr/generate',{count:+genN}); setMsg(`${r.generated} QR generated`); load() }
  const assignQr=async()=>{ try{const r=await api.post('/admin/qr/assign',{emp_code:asg.emp_code,count:+asg.count}); setMsg(`${r.assigned} assigned to ${r.emp_code}`); load()}catch(e){setMsg(e.message)} }
  const dlPdf=(status)=>downloadFile(`/admin/qr/pdf?status=${status}&limit=60`,`nammaoor_qr_${status}.pdf`)
  // Download only NEW (not-yet-downloaded) QRs — exact count, old ones never repeat.
  const dlNew=async()=>{ const n=+dlN||1; try{ await downloadFile(`/admin/qr/pdf?status=unassigned&count=${n}&new_only=true&mark=true`,`nammaoor_qr_new_${n}.pdf`); setMsg(`${n} new QR downloaded`); load() }catch(e){ setMsg('❌ '+(e.message||'No new QR — generate first')) } }
  const createEmp=async()=>{ try{const r=await api.post('/admin/employees',{...newEmp,district_id:newEmp.district_id?+newEmp.district_id:null}); setCred(r); setMsg(''); load()}catch(e){setMsg(e.message)} }
  const searchEmp=async()=>{ setEmps(await api.get('/admin/employees'+(empSearch?('?search='+encodeURIComponent(empSearch)):''))) }
  const openEmp=async(code)=>{ try{ setEmpDet(await api.get(`/admin/employees/${code}/details`)) }catch(e){setMsg(e.message)} }
  const resetPwd=async(code)=>{ const np=prompt('New password for '+code); if(!np)return; const r=await api.post(`/admin/employees/${code}/password`,{new_password:np}); setMsg(`${code} password set: ${r.new_password}`) }
  const cleanupTests=async()=>{ if(!confirm('Delete ALL draft & unpaid test shops? (Active shops safe)'))return
    const r=await api.post('/admin/cleanup-tests'); setMsg(`🧹 ${r.deleted} test shops deleted`); load() }
  const wipeAll=async()=>{ if(!confirm('⚠️ Delete ALL SHOPS (active-um serthu)? Admin & employees mattum meedhi irukkum.'))return
    if(!confirm('Confirm again: FRESH START — ella shops & shop-owner logins delete aagum. Numbering NM-000001-la irundhu restart. Sure-ah?'))return
    const r=await api.post('/admin/wipe-all-shops'); setMsg(`🗑 ${r.deleted_shops} shops wiped. Fresh start ready!`); load() }
  const addMaster=async()=>{ try{ const r=await api.post('/admin/catalog/master',mcForm)
      setCatMsg(`✅ Added ${r.product_id} — ${r.name}`); setMcForm({...mcForm,name:''}); load() }catch(e){ setCatMsg('❌ '+e.message) } }
  const importCsv=async()=>{ if(!csvText.trim()){ setCatMsg('CSV paste pannunga'); return }
    setImp(null); setCatMsg('Importing…')
    try{ const r=await api.post('/admin/catalog/import',{csv:csvText}); setImp(r)
      setCatMsg(`✅ ${r.added} added · ${r.skipped_duplicates} duplicate skipped · ${r.error_count} errors`); setCsvText(''); load() }
    catch(e){ setCatMsg('❌ '+e.message) } }
  const exportCsv=()=>downloadFile('/admin/catalog/export','nammaoor_master_catalog.csv')
  const ensureLib=(g,src)=>window[g]?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})
  const ensureXLSX=()=>ensureLib('XLSX','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')
  const ensureJSZip=()=>ensureLib('JSZip','https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js')
  const _bufToCsv=async(buf)=>{ await ensureXLSX(); const wb=window.XLSX.read(buf,{type:'array'})
    return window.XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]) }
  const collectCsvs=async(files)=>{ const out=[]
    for(const f of files){ const nm=(f.name||'').toLowerCase()
      if(nm.endsWith('.csv')){ out.push({name:f.name,csv:await f.text()}) }
      else if(nm.endsWith('.xlsx')||nm.endsWith('.xls')){ out.push({name:f.name,csv:await _bufToCsv(await f.arrayBuffer())}) }
      else if(nm.endsWith('.zip')){ await ensureJSZip(); const zip=await window.JSZip.loadAsync(await f.arrayBuffer())
        for(const z of Object.values(zip.files)){ if(z.dir||!/\.(csv|xlsx|xls)$/i.test(z.name))continue
          if(/\.csv$/i.test(z.name)) out.push({name:z.name,csv:await z.async('string')})
          else out.push({name:z.name,csv:await _bufToCsv(await z.async('arraybuffer'))}) } } }
    return out }
  const importFiles=async(files)=>{ if(!files||!files.length)return
    setBusy(true); setImp(null); setCatMsg('Files process aaguthu…')
    try{ const csvs=await collectCsvs(files)
      if(!csvs.length){ setCatMsg('❌ CSV / Excel / ZIP file thaan pottunga'); setBusy(false); return }
      let added=0,skipped=0,errs=[]
      for(const c of csvs){ if(!c.csv||!c.csv.trim())continue
        const r=await api.post('/admin/catalog/import',{csv:c.csv})
        added+=r.added||0; skipped+=r.skipped_duplicates||0
        if(r.errors&&r.errors.length) errs.push(...r.errors.map(e=>c.name+': '+e)) }
      setImp({added,skipped_duplicates:skipped,error_count:errs.length,errors:errs})
      setCatMsg(`✅ ${csvs.length} file(s) · ${added} added · ${skipped} duplicate skipped · ${errs.length} errors`); load() }
    catch(e){ setCatMsg('❌ '+e.message) }
    setBusy(false) }
  const onCatFile=(e)=>{ importFiles(e.target.files); e.target.value='' }
  const onDrop=(e)=>{ e.preventDefault(); setDragOver(false); importFiles(e.dataTransfer.files) }
  const delShop=async(code)=>{ if(!confirm('Delete shop '+code+'? QR will be permanently disabled.'))return; await api.del(`/admin/shops/${code}`); setMsg(`${code} deleted, QR disabled`); load() }
  const wStatus=async(id,st)=>{ if(st==='approve'){await api.post(`/admin/withdrawals/${id}/approve`)} else if(st==='reject'){await api.post(`/admin/withdrawals/${id}/reject`)} else {await api.post(`/admin/withdrawals/${id}/status`,{status:st})} load() }
  const platWithdraw=async()=>{ const a=prompt('Platform withdrawal amount'); if(!a)return; const u=prompt('Your UPI ID'); await api.post('/admin/platform-withdraw',{amount:+a,upi_id:u||''}); setMsg('Platform withdrawal requested') }
  const fs=shops.filter(s=>!shopSearch||(s.shop_name||'').toLowerCase().includes(shopSearch.toLowerCase())||(s.shop_code||'').includes(shopSearch))
  return (<><Header/><div className="container">
    <h2 className="brand">Super Admin</h2>
    <div className="card" style={{border:'1px solid #ffd7d7',background:'#fff8f8'}}>
      <b>🔒 Change Admin Password</b>
      <div className="grid2" style={{marginTop:8}}>
        <PwInput value={pw.current} onChange={e=>setPw({...pw,current:e.target.value})} placeholder="Current password"/>
        <PwInput value={pw.next} onChange={e=>setPw({...pw,next:e.target.value})} placeholder="New password (min 6)"/>
      </div>
      <button className="btn" onClick={changePw}>Update Password</button>
      <p className="muted" style={{fontSize:12,marginTop:6}}>Default password-a udane strong-ah maathunga (security).</p>
    </div>
    <div className="row" style={{marginTop:10}}>
      <div className="kpi"><b>Rs.{rev.total_revenue||0}</b><span>Revenue</span></div>
      <div className="kpi"><b>{rev.active_shops||0}</b><span>Active Shops</span></div>
      <div className="kpi"><b>{an.shop_views||0}</b><span>Shop Views</span></div>
      <div className="kpi"><b>{emps.length}</b><span>Employees</span></div>
    </div>
    {ov.districts && ov.districts.length>0 && <div className="card" style={{marginTop:14}}><h3>District-wise Shops</h3>
      {ov.districts.map((d,i)=><div key={i} className="row" style={{justifyContent:'space-between',padding:'3px 0'}}><span>{d.name}</span><b>{d.shops}</b></div>)}
      <h4 style={{marginTop:10}}>Recent Registrations</h4>
      {(ov.recent||[]).map((r,i)=><div key={i} className="muted">{r.shop_code} - {r.shop_name}</div>)}
    </div>}
    <div className="card" style={{marginTop:14}}><h3>QR Management</h3>
      <div className="row">
        <div className="kpi"><b>{qr.total||0}</b><span>Total</span></div>
        <div className="kpi"><b>{qr.unassigned||0}</b><span>Unassigned</span></div>
        <div className="kpi"><b>{qr.assigned||0}</b><span>Assigned</span></div>
        <div className="kpi"><b>{qr.used||0}</b><span>Used</span></div>
      </div>
      <div className="row" style={{marginTop:10}}>
        <input className="input" style={{flex:1}} type="number" placeholder="Generate count" value={genN} onChange={e=>setGenN(e.target.value)}/>
        <button className="btn" onClick={genQr}>Generate</button>
      </div>
      <div style={{marginTop:10,background:'#f6f2ff',border:'1px solid #e3d9fb',borderRadius:12,padding:10}}>
        <p className="muted" style={{margin:'0 0 8px',fontSize:13}}>Ethana QR venum-nu podu → pudhusa (download aagatha) QR mattum varum. Pazhaya QR marupadi download aagaadhu.</p>
        <div className="row">
          <input className="input" style={{flex:1}} type="number" min="1" placeholder="How many?" value={dlN} onChange={e=>setDlN(e.target.value)}/>
          <button className="btn" onClick={dlNew}>⬇️ Download New QR</button>
        </div>
      </div>
      <div className="row" style={{marginTop:10}}>
        <input className="input" style={{flex:2}} placeholder="Employee (EMP-0001)" value={asg.emp_code} onChange={e=>setAsg({...asg,emp_code:e.target.value})}/>
        <input className="input" style={{flex:1}} type="number" value={asg.count} onChange={e=>setAsg({...asg,count:e.target.value})}/>
        <button className="btn" onClick={assignQr}>Assign</button>
      </div>
    </div>

    <div className="card" style={{marginTop:14}}><h3>🗂️ Master Catalog</h3>
      <p className="muted" style={{marginTop:2}}>Total <b>{catStats.total||0}</b> products · {(catStats.categories||[]).length} categories</p>
      {(catStats.categories||[]).length>0 && <p className="muted" style={{fontSize:12,marginTop:4}}>
        {catStats.categories.map(c=>`${c.category} (${c.count})`).join(' · ')}</p>}

      <h4 style={{margin:'12px 0 4px'}}>➕ Add Product</h4>
      <div className="grid2">
        <input className="input" placeholder="Category (e.g. Grocery)" value={mcForm.category} onChange={e=>setMcForm({...mcForm,category:e.target.value})}/>
        <input className="input" placeholder="Sub Category (e.g. Rice)" value={mcForm.sub_category} onChange={e=>setMcForm({...mcForm,sub_category:e.target.value})}/>
        <input className="input" placeholder="Product name" value={mcForm.name} onChange={e=>setMcForm({...mcForm,name:e.target.value})}/>
        <input className="input" placeholder="Unit (Kg/Cup/Piece)" value={mcForm.unit} onChange={e=>setMcForm({...mcForm,unit:e.target.value})}/>
      </div>
      <button className="btn sm" style={{marginTop:6}} onClick={addMaster}
        disabled={!mcForm.name||!mcForm.category||!mcForm.sub_category}>Add to catalog</button>

      <h4 style={{margin:'14px 0 4px'}}>📥 Excel / CSV / ZIP Bulk Import</h4>
      <p className="muted" style={{fontSize:12}}>Columns: <code>product_name, category, sub_category, unit, product_type, keywords</code> — first row = header. Duplicates auto-skip.</p>
      <div onDragOver={e=>{e.preventDefault();setDragOver(true)}} onDragLeave={()=>setDragOver(false)} onDrop={onDrop}
        style={{border:'2px dashed '+(dragOver?'#7A2FF7':'var(--line)'),borderRadius:12,padding:'20px 14px',textAlign:'center',
          background:dragOver?'#f3efff':'#fafaff',marginBottom:8,transition:'.15s'}}>
        <div style={{fontSize:30}}>{busy?'⏳':'📥'}</div>
        <p style={{fontWeight:700,margin:'4px 0'}}>{busy?'Processing…':'Files-a inga drag & drop pannunga'}</p>
        <p className="muted" style={{fontSize:12,margin:0}}>Excel (.xlsx/.xls) · CSV · ZIP (pala files serthu) — multiple ok</p>
        <label className="btn ghost sm" style={{display:'inline-block',marginTop:8}}>📎 Files thernthedu
          <input type="file" accept=".csv,.xlsx,.xls,.zip" multiple onChange={onCatFile} style={{display:'none'}}/></label>
      </div>
      <p className="muted" style={{fontSize:11,margin:'0 0 4px'}}>…allathu keezha CSV-a paste panni Import pannunga:</p>
      <textarea rows="4" placeholder={"product_name,category,sub_category,unit\nBasmati Rice,Grocery,Rice,Kg\nIdli Rice,Grocery,Rice,Kg"}
        value={csvText} onChange={e=>setCsvText(e.target.value)} style={{fontFamily:'monospace',fontSize:12}}/>
      <div className="row" style={{gap:8}}>
        <button className="btn sm" onClick={importCsv} disabled={!csvText.trim()}>⬆️ Import CSV</button>
        <button className="btn sm ghost" onClick={exportCsv}>⬇️ Export all (CSV)</button>
      </div>
      {imp && imp.errors && imp.errors.length>0 && <div style={{marginTop:8,maxHeight:120,overflowY:'auto',background:'#fff6f6',border:'1px solid #ffd7d7',borderRadius:8,padding:8,fontSize:12}}>
        {imp.errors.map((er,i)=><div key={i}>⚠️ {er}</div>)}</div>}
      {catMsg && <p style={{color:'var(--teal)',marginTop:8}}>{catMsg}</p>}
    </div>

    <div className="card"><h3>Add Employee</h3>
      <div className="grid2">
        <input className="input" placeholder="Full name" onChange={e=>setNewEmp({...newEmp,full_name:e.target.value})}/>

      </div>

      {cred && <div style={{marginTop:10,padding:12,background:'#eafaf4',borderRadius:12}}>

        <p>Username: <b>{cred.username||cred.emp_code}</b></p><p>Password: <b>{cred.login_password}</b></p></div>}

      <table><tr><th>Emp</th><th>Rs.</th><th>UPI</th><th>Status</th><th>Action</th></tr>
        {wd.map(w=><tr key={w.id}><td>{w.emp_code||(w.employee_id||'').slice(0,8)}</td><td>{w.amount}</td><td className="muted">{w.upi||'-'}</td>

      </table>{wd.length===0 && <p className="muted">No withdrawals.</p>}</div>

    <div className="card"><h3>Employees</h3>

      </div>
      <table><tr><th>Code</th><th>Name</th><th>Mobile</th><th>Wallet</th><th>Action</th></tr>
        {emps.map((e,i)=><tr key={i}><td><a style={{color:'var(--purple)',cursor:'pointer',fontWeight:700}} onClick={()=>openEmp(e.emp_code)}>{e.emp_code}</a></td>
          <td>{e.full_name||'-'}</td><td><a style={{cursor:'pointer'}} onClick={()=>openEmp(e.emp_code)}>{e.mobile}</a></td><td>Rs.{e.wallet}</td>
          <td><button className="btn sm ghost" onClick={()=>resetPwd(e.emp_code)}>Change Pwd</button></td></tr>)}
      </table>
      {empDet && <div style={{marginTop:10,padding:12,background:'#f7f6fc',borderRadius:12}}>
        <b>{empDet.emp_code} - {empDet.full_name}</b>
        <p className="muted">Mobile: {empDet.mobile} | Wallet: Rs.{empDet.wallet} | Shops: {empDet.total_shops} | Verified: {empDet.verified?'Yes':'No'}</p>
        <p className="muted">UPI: {empDet.upi_id||'-'} | Password: {empDet.password_note}</p>
        <button className="btn sm" onClick={()=>resetPwd(empDet.emp_code)}>Change Password</button>
        <button className="btn sm ghost" onClick={()=>setEmpDet(null)}>Close</button></div>}
    </div>

    <div className="card"><div className="row" style={{justifyContent:'space-between',alignItems:'center'}}>
        <h3>Shops</h3>
        <div className="row" style={{gap:6}}>
          <button className="btn sm ghost" onClick={cleanupTests}>🧹 Clean drafts/unpaid</button>
          <button className="btn sm" style={{background:'#c0392b'}} onClick={wipeAll}>🗑 Fresh Start (all shops)</button>
        </div>
      </div>
      <input className="input" placeholder="Search shop" value={shopSearch} onChange={e=>setShopSearch(e.target.value)}/>
      <table><tr><th>ID</th><th>Name</th><th>Status</th><th>Action</th></tr>
        {fs.slice(0,80).map((s,i)=><tr key={i}><td>{s.shop_code||'-'}</td><td>{s.shop_name}</td>
          <td><span className={'tag '+(s.status==='active'?'a':'e')}>{s.status}</span></td>
          <td>{s.shop_code&&<button className="btn sm ghost" onClick={()=>delShop(s.shop_code)}>Delete + Disable QR</button>}</td></tr>)}
      </table></div>
    <p style={{color:'var(--teal)'}}>{msg}</p>
  </div></>)
}
