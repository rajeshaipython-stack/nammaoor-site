<!doctype html><html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NammaOor Shop Spotlight Maker</title>
<style>
 body{font-family:system-ui,'Segoe UI',sans-serif;background:#f4f1fb;margin:0;padding:16px;color:#141225}
 h2{background:linear-gradient(135deg,#FF6A00,#FF2E7E,#7A2FF7);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 14px}
 .wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:360px 1fr;gap:20px}
 @media(max-width:820px){.wrap{grid-template-columns:1fr}}
 label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
 input,textarea{width:100%;padding:10px 12px;border:1px solid #ddd6ee;border-radius:10px;font-size:14px;box-sizing:border-box}
 .btn{background:linear-gradient(135deg,#FF6A00,#FF2E7E,#7A2FF7);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:14px}
 canvas{width:100%;max-width:540px;border-radius:16px;box-shadow:0 8px 24px rgba(30,20,70,.12);display:block;margin:0 auto}
 .card{background:#fff;border:1px solid #eee;border-radius:16px;padding:16px}
 small{color:#777}
</style></head><body>
<div class="wrap">
 <div class="card">
  <h2>Shop Spotlight Maker</h2>
  <label>Shop Name</label><input id="name" placeholder="Murugan Stores" oninput="draw()">
  <label>Area / Town</label><input id="area" placeholder="Gandhi Road, Arani" oninput="draw()">
  <label>Category</label><input id="cat" placeholder="Grocery" oninput="draw()">
  <label>Offer (optional)</label><input id="offer" placeholder="10% OFF today!" oninput="draw()">
  <label>Shop / Product Photo</label><input type="file" accept="image/*" id="photo" onchange="loadImg(this,'shop')">
  <label>Shop QR (optional)</label><input type="file" accept="image/*" id="qr" onchange="loadImg(this,'qr')">
  <button class="btn" onclick="dl()">Download Poster</button>
  <small>Fields fill pannunga -> photo upload -> Download. Instagram/WhatsApp-la post pannunga.</small>
 </div>

</div>

var shopImg=null,qrImg=null;
logo.onload=draw;
function loadImg(inp,which){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){if(which=="shop")shopImg=im;else qrImg=im;draw()};im.src=r.result};r.readAsDataURL(f)}
function rr(ctx,x0,y0,w,h,r){ctx.beginPath();ctx.moveTo(x0+r,y0);ctx.arcTo(x0+w,y0,x0+w,y0+h,r);ctx.arcTo(x0+w,y0+h,x0,y0+h,r);ctx.arcTo(x0,y0+h,x0,y0,r);ctx.arcTo(x0,y0,x0+w,y0,r);ctx.closePath()}
function cover(ctx,im,x,y,w,h){var s=Math.max(w/im.width,h/im.height);var nw=im.width*s,nh=im.height*s;ctx.save();rr(ctx,x,y,w,h,26);ctx.clip();ctx.drawImage(im,x+(w-nw)/2,y+(h-nh)/2,nw,nh);ctx.restore()}
function draw(){
 var c=document.getElementById('c'),x=c.getContext('2d');
 x.fillStyle='#f7f4fb';x.fillRect(0,0,1080,1080);
 // header gradient band
 var g=x.createLinearGradient(0,0,1080,240);g.addColorStop(0,'#FF2E7E');g.addColorStop(1,'#7A2FF7');
 x.fillStyle=g;x.fillRect(0,0,1080,240);
 // WHITE CHIP behind logo -> logo clearly visible
 x.save();x.shadowColor='rgba(0,0,0,.15)';x.shadowBlur=18;x.shadowOffsetY=5;
 x.fillStyle='#fff';rr(x,40,40,360,160,24);x.fill();x.restore();
 if(logo.complete){var pad=22,bw=360-pad*2,bh=160-pad*2;var s=Math.min(bw/logo.width,bh/logo.height);var lw=logo.width*s,lh=logo.height*s;x.drawImage(logo,40+(360-lw)/2,40+(160-lh)/2,lw,lh);}
 // title (white on gradient, right side)
 x.fillStyle='#fff';x.textAlign='center';
 x.font='bold 46px sans-serif';x.fillText('SHOP SPOTLIGHT',735,112);
 x.font='26px sans-serif';x.fillStyle='#ffe7f1';x.fillText('Featured on NammaOor',735,158);
 // photo box
 if(shopImg){cover(x,shopImg,70,290,940,400);}else{x.fillStyle='#e8e2f4';rr(x,70,290,940,400,30);x.fill();x.fillStyle='#9a90b5';x.textAlign='center';x.font='34px sans-serif';x.fillText('[ Shop / Product Photo ]',540,475);x.font='24px sans-serif';x.fillText('upload panneenga -> inga varum',540,515);}
 // details card
 x.fillStyle='#fff';rr(x,70,720,940,290,30);x.fill();x.strokeStyle='#eee';x.lineWidth=2;x.stroke();
 x.textAlign='left';x.fillStyle='#141225';x.font='bold 50px sans-serif';
 x.fillText(val('name','SHOP NAME'),100,792);
 x.fillStyle='#5a5578';x.font='30px sans-serif';
 x.fillText(val('area','Area, Town')+'  -  '+val('cat','Category'),100,838);
 var off=val('offer','');
 if(off){x.fillStyle='#fff4e0';rr(x,100,865,380,58,29);x.fill();x.fillStyle='#8a5a00';x.font='bold 26px sans-serif';x.fillText('Offer: '+off,120,903);}
 if(qrImg){x.drawImage(qrImg,770,745,170,170);}else{x.fillStyle='#f0eef8';rr(x,770,745,170,170,14);x.fill();x.fillStyle='#a89fc0';x.textAlign='center';x.font='38px sans-serif';x.fillText('QR',855,825);x.textAlign='left';}
 x.fillStyle='#008c78';x.font='26px sans-serif';x.fillText('Scan QR -> Pay - Call - WhatsApp',100,958);
 x.fillStyle='#7A2FF7';x.font='bold 28px sans-serif';x.fillText('nammaoor.shop',100,995);
}
function val(id,def){var v=document.getElementById(id).value.trim();return v||def}
function dl(){var a=document.createElement('a');a.download=(val('name','shop').replace(/[^a-z0-9]/gi,'_'))+'_spotlight.png';a.href=document.getElementById('c').toDataURL('image/png');a.click()}
draw();
</script></body></html>
